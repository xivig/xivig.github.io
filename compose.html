{{#> admin-layout title="Compose" }}

<div class="row g-4">
                        {{> mail-sidebar }}

                        <main class="col-lg-9">
                            <div class="compose card border-0 shadow-lg rounded-4 overflow-hidden">
                                <div class="compose__header card-header bg-white border-bottom p-4">
                                    <div class="d-flex align-items-center justify-content-between">
                                        <h5 class="mb-0 fw-bold">New Message</h5>
                                        <div class="compose__controls">
                                            <button class="btn btn-link text-muted p-0 me-2"><i
                                                    class="bi bi-fullscreen"></i></button>
                                            <button class="btn btn-link text-muted p-0"><i
                                                    class="bi bi-x-lg"></i></button>
                                        </div>
                                    </div>
                                </div>

                                <div class="compose__body card-body p-4">
                                    <form id="composeForm">
                                        <div
                                            class="compose__field mb-3 d-flex align-items-center border-bottom pb-2">
                                            <span class="text-muted small fw-bold text-uppercase me-3"
                                                style="width: 50px;">To</span>
                                            <input type="email"
                                                class="form-control border-0 shadow-none bg-transparent ps-0"
                                                placeholder="architect@xivig.com">
                                            <span
                                                class="compose__action text-primary small fw-bold cursor-pointer">Cc/Bcc</span>
                                        </div>

                                        <div
                                            class="compose__field mb-4 d-flex align-items-center border-bottom pb-2">
                                            <span class="text-muted small fw-bold text-uppercase me-3"
                                                style="width: 50px;">Sub</span>
                                            <input type="text"
                                                class="form-control border-0 shadow-none bg-transparent ps-0"
                                                placeholder="Enter subject line...">
                                        </div>

                                        <div class="compose__editor-wrapper mb-4">
                                            <textarea
                                                class="form-control border-0 shadow-none bg-transparent p-0 custom-scroll"
                                                rows="12"
                                                placeholder="Start writing your message..."></textarea>
                                        </div>

                                        <div
                                            class="compose__attachment p-3 bg-light rounded-4 d-flex align-items-center justify-content-between">
                                            <div class="d-flex align-items-center">
                                                <i class="bi bi-paperclip fs-5 text-primary me-2"></i>
                                                <div>
                                                    <span class="d-block small fw-bold text-dark">Add
                                                        Assets</span>
                                                    <small class="text-muted extra-small">Images or Docs (Max
                                                        32MB)</small>
                                                </div>
                                            </div>
                                            <input type="file" id="fileInput" class="d-none">
                                            <button type="button"
                                                onclick="document.getElementById('fileInput').click()"
                                                class="btn btn-white btn-sm border shadow-sm rounded-pill px-3">
                                                Browse Files
                                            </button>
                                        </div>
                                    </form>
                                </div>

                                <div
                                    class="compose__footer card-footer bg-white p-4 border-top d-flex justify-content-between align-items-center">
                                    <button class="btn btn-link text-danger text-decoration-none fw-bold p-0">
                                        <i class="bi bi-trash3 me-1"></i> Discard
                                    </button>

                                    <div class="d-flex gap-3">
                                        <button
                                            class="btn btn-outline-light border text-dark px-4 rounded-3 fw-semibold">
                                            Save Draft
                                        </button>
                                        <button class="btn btn-primary px-5 rounded-3 fw-bold shadow-primary">
                                            Send Message <i class="bi bi-send-fill ms-2"></i>
                                        </button>
                                    
                    

{{/admin-layout}}
