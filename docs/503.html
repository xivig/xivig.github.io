<!DOCTYPE html>

<head>
    <script>window.XIVIG_ROOT = "./";</script>
    <meta charset="UTF-8">
    <title>503 Service Unavailable | XivigApp</title>
    <meta name="description" content="Xivig — Elite modern Bootstrap 5 UI framework, responsive layouts, modular components, and real-time dashboard architecture.">
    
    <!-- Site favicon -->
    <link rel="apple-touch-icon" sizes="180x180" href="./assets/apple-touch-icon.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="./assets/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="./assets/favicon-16x16.png" />
    
    <!-- Mobile Specific Metas -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#101B33" />
    
    <!-- Instant Atelier Theme & Accent Initialization -->
    <script>
        (function() {
            try {
                const savedTheme = localStorage.getItem('xivig-global-theme') || 'light';
                const effectiveTheme = savedTheme === 'auto'
                    ? (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light')
                    : savedTheme;
                document.documentElement.setAttribute('data-bs-theme', effectiveTheme);
    
                const savedAccent = localStorage.getItem('xivig-accent-color') || '#4059E8';
                if (savedAccent) {
                    document.documentElement.style.setProperty('--elite-primary', savedAccent);
                    document.documentElement.style.setProperty('--xivig-primary', savedAccent);
                    document.documentElement.style.setProperty('--primary-accent', savedAccent);
                    document.documentElement.style.setProperty('--primary-hover', savedAccent);
                    document.documentElement.style.setProperty('--bs-primary', savedAccent);
                }
    
                const savedScale = localStorage.getItem('xivig-typography-scale');
                if (savedScale && savedScale !== '100') {
                    document.documentElement.style.fontSize = savedScale + '%';
                }
            } catch (e) {}
        })();
    </script>
    
    
    
    <!-- Google Fonts Elite Typography (Plus Jakarta Sans & Inter & JetBrains Mono) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">

<body class="home-layout error-page-503" data-bs-spy="scroll" data-bs-target="#mainNav">

    

    <main >
        
        <style>
            .error-page-503 {
                background-color: #f8fafc;
                min-height: 100vh;
                display: flex;
                align-items: center;
                justify-content: center;
                margin: 0;
                font-family: 'Inter', system-ui, -apple-system, sans-serif;
            }
        
            .status-card {
                background: #ffffff;
                border-radius: 2rem;
                padding: 3.5rem 2rem;
                box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.1);
                max-width: 520px;
                width: 90%;
                text-align: center;
                border: 1px solid #e2e8f0;
                border-bottom: 8px solid #0d9488;
            }
        
            .loader-dots {
                display: flex;
                justify-content: center;
                gap: 8px;
                margin-bottom: 25px;
            }
        
            .dot {
                width: 12px;
                height: 12px;
                background: #0d9488;
                border-radius: 50%;
                animation: blink 1.4s infinite both;
            }
        
            .dot:nth-child(2) {
                animation-delay: 0.2s;
            }
        
            .dot:nth-child(3) {
                animation-delay: 0.4s;
            }
        
            @keyframes blink {
                0%,
                80%,
                100% {
                    opacity: 0.2;
                    transform: scale(0.8);
                }
                40% {
                    opacity: 1;
                    transform: scale(1.2);
                }
            }
        
            .error-code {
                font-size: 7rem;
                font-weight: 900;
                color: #1e293b;
                line-height: 1;
                margin-bottom: 1rem;
                letter-spacing: -0.05em;
            }
        
            .status-title {
                font-size: 1.75rem;
                font-weight: 700;
                color: #334155;
                margin-bottom: 1rem;
            }
        
            .status-message {
                color: #64748b;
                font-size: 1.1rem;
                line-height: 1.6;
                margin-bottom: 2.5rem;
            }
        
            .btn-refresh {
                background: #1e293b;
                color: #ffffff;
                padding: 1rem 2.5rem;
                border-radius: 1rem;
                font-weight: 600;
                text-decoration: none;
                transition: all 0.3s ease;
                display: inline-block;
            }
        
            .btn-refresh:hover {
                background: #0d9488;
                transform: translateY(-2px);
                color: #ffffff;
            }
        
            /* Dark mode support */
            [data-bs-theme='dark'] .error-page-503 {
                background-color: #0f172a;
            }
            [data-bs-theme='dark'] .status-card {
                background: #1e293b;
                border-color: #334155;
                box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            }
            [data-bs-theme='dark'] .error-code {
                color: #f1f5f9;
            }
            [data-bs-theme='dark'] .status-title {
                color: #f1f5f9;
            }
            [data-bs-theme='dark'] .status-message {
                color: #94a3b8;
            }
            [data-bs-theme='dark'] .btn-refresh {
                background: #0d9488;
            }
        </style>
        
        <div class="status-card text-center">
            <div class="loader-dots">
                <div class="dot"></div>
                <div class="dot"></div>
                <div class="dot"></div>
            </div>
        
            <h1 class="error-code">503</h1>
            <h3 class="status-title">Service Unavailable</h3>
        
            <p class="status-message">
                We’re fine-tuning things to make your experience even better.<br>
                We'll be back online in just a few minutes!
            </p>
        
            <a href="index.html" class="btn btn-refresh">
                Try Again
            </a>
        </div>
        
    </main>


    <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
