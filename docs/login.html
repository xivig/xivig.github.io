<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Login | Xivig Elite</title>
    
    <!-- Site favicon -->
    <link rel="apple-touch-icon" sizes="180x180" href="./assets/apple-touch-icon.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="./assets/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="./assets/favicon-16x16.png" />
    
    <!-- Mobile Specific Metas -->
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
    
    <!-- Theme Detection (Prevents flashing) -->
    <script>
      document.addEventListener("DOMContentLoaded", function() {
        const savedTheme = localStorage.getItem('xivig-global-theme') || 'dark';
        document.body.setAttribute('data-bs-theme', savedTheme);
      });
    </script>
    
    <!-- Vendor Styles (Third Party) -->
    
    <!-- Master CSS (Core Architecture) -->
    
    <!-- Components CSS (UI Elements) -->
    
    <!-- Cropper.js v1.6.2 (Compatibility for Elite Layout) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.6.2/cropper.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.6.2/cropper.min.js"></script>
    
    <!-- Dropzone.js v6 (Modern Media Upload) -->
    <link rel="stylesheet" href="https://unpkg.com/dropzone@6.0.0-beta.1/dist/dropzone.css">
    <script src="https://unpkg.com/dropzone@6.0.0-beta.1/dist/dropzone-min.js"></script>
    
    <!-- AOS (Animate On Scroll) -->
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
    
    <!-- Form Components Dependencies -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@simonwep/pickr/dist/themes/classic.min.css"/>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css"/>
    
    <!-- Vector Map (MapLibre) -->
    <link href="https://unpkg.com/maplibre-gl@4.3.2/dist/maplibre-gl.css" rel="stylesheet"/>
  <link rel="stylesheet" crossorigin href="./assets/components.css">
  <link rel="stylesheet" crossorigin href="./assets/main.css">
  <link rel="stylesheet" crossorigin href="./assets/vendors.css">
</head>

<body class="auth-page">

    <div class="auth-card animate__animated animate__zoomIn">
        <div class="text-center">
            <h2 class="auth-card__title">Elite Login</h2>
            <p class="auth-card__subtitle">Sign in to access your architect dashboard.</p>
        </div>

        <div class="social-auth">
            <a href="#" class="social-btn"><i class="fa-brands fa-github"></i></a>
            <a href="#" class="social-btn text-danger"><i class="fa-brands fa-google"></i></a>
            <a href="#" class="social-btn text-primary"><i class="fa-brands fa-linkedin-in"></i></a>
        </div>

        <div class="auth-divider">
            <span>OR CONTINUE WITH EMAIL</span>
        </div>

        <form action="index.html">
            <div class="mb-4">
                <div class="input-group auth-input-group">
                    <span class="input-group-text"><i class="bi bi-envelope"></i></span>
                    <input type="email" class="form-control" placeholder="architect@xivig.com" required>
                </div>
            </div>

            <div class="mb-3">
                <div class="input-group auth-input-group">
                    <span class="input-group-text"><i class="bi bi-shield-lock"></i></span>
                    <input type="password" class="form-control" placeholder="••••••••" required>
                </div>
            </div>

            <div class="d-flex justify-content-between align-items-center mb-4">
                <div class="form-check">
                    <input class="form-check-input" type="checkbox" id="rememberMe">
                    <label class="form-check-label small text-muted" for="rememberMe">Remember me</label>
                </div>
                <a href="forgot-password.html" class="auth-link small">Forgot Password?</a>
            </div>

            <button type="submit" class="btn btn-primary w-100 py-3 rounded-3 fw-bold shadow-sm mb-4">
                Enter Dashboard
            </button>

            <p class="text-center small text-muted mb-0">
                New to Xivig? <a href="register.html" class="auth-link">Create an Account</a>
            </p>
        </form>
    </div>

</body>

</html>
