<!DOCTYPE html>
<html lang="en">

<head>
    <script>window.XIVIG_ROOT = "./";</script>
    <meta charset="UTF-8">
    <title>Login | Xivig Elite</title>
    <meta name="description" content="Sign in securely to your Xivig account to manage applications, monitor analytics, and configure infrastructure.">
    
    <!-- Site favicon -->
    <link rel="apple-touch-icon" sizes="180x180" href="./assets/apple-touch-icon.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="./assets/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="./assets/favicon-16x16.png" />
    
    <!-- Mobile Specific Metas -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#101B33" />
    
    <!-- Instant Atelier Theme & Accent Initialization -->
    <script>
        (function() {
            try {
                const savedTheme = localStorage.getItem('xivig-global-theme') || 'light';
                const effectiveTheme = savedTheme === 'auto'
                    ? (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light')
                    : savedTheme;
                document.documentElement.setAttribute('data-bs-theme', effectiveTheme);
    
                const savedAccent = localStorage.getItem('xivig-accent-color') || '#4059E8';
                if (savedAccent) {
                    document.documentElement.style.setProperty('--elite-primary', savedAccent);
                    document.documentElement.style.setProperty('--xivig-primary', savedAccent);
                    document.documentElement.style.setProperty('--primary-accent', savedAccent);
                    document.documentElement.style.setProperty('--primary-hover', savedAccent);
                    document.documentElement.style.setProperty('--bs-primary', savedAccent);
                }
    
                const savedScale = localStorage.getItem('xivig-typography-scale');
                if (savedScale && savedScale !== '100') {
                    document.documentElement.style.fontSize = savedScale + '%';
                }
            } catch (e) {}
        })();
    </script>
    
    
    
    <!-- Google Fonts Elite Typography (Plus Jakarta Sans & Inter & JetBrains Mono) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Inter:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    
    <!-- Vendor Styles (Essential Only) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    
    <!-- Auth Theme SCSS (Render-blocking in Head to Prevent FOUC) -->
    
    
  <script type="module" crossorigin src="./assets/mobile-controller.js"></script>
  <script type="module" crossorigin src="./assets/rolldown-runtime.js"></script>
  <script type="module" crossorigin src="./assets/vendor-core.js"></script>
  <script type="module" crossorigin src="./assets/auth.js"></script>
  <link rel="stylesheet" crossorigin href="./assets/vendor-core.css">
  <link rel="stylesheet" crossorigin href="./assets/auth.css">
</head>

<body class="auth-page">

    
    <div class="auth-card animate__animated animate__zoomIn">
        
        <div class="text-center">
            <h2 class="auth-card__title">Elite Login</h2>
            <p class="auth-card__subtitle">Sign in to access your architect dashboard.</p>
        </div>
        
        <div class="social-auth">
            <a href="#" class="social-btn"><i class="fa-brands fa-github"></i></a>
            <a href="#" class="social-btn text-danger"><i class="fa-brands fa-google"></i></a>
            <a href="#" class="social-btn text-primary"><i class="fa-brands fa-linkedin-in"></i></a>
        </div>
        
        <div class="auth-divider">
            <span>OR CONTINUE WITH EMAIL</span>
        </div>
        
        <div class="alert alert-info py-2 px-3 small border-0 rounded-3 mb-4 d-flex align-items-center">
            <i class="bi bi-info-circle me-2 flex-shrink-0"></i>
            <span><strong>Demo Mode:</strong> Pre-wired frontend form. Connect action to your authentication backend.</span>
        </div>
        
        <form action="index.html" method="POST" id="loginForm">
            <div class="mb-4">
                <div class="input-group auth-input-group">
                    <span class="input-group-text"><i class="bi bi-envelope"></i></span>
                    <input type="email" name="email" id="loginEmail" class="form-control" placeholder="architect@xivig.com" autocomplete="email" required>
                </div>
            </div>
        
            <div class="mb-3">
                <div class="input-group auth-input-group">
                    <span class="input-group-text"><i class="bi bi-shield-lock"></i></span>
                    <input type="password" name="password" id="loginPassword" class="form-control" placeholder="••••••••" autocomplete="current-password" required>
                </div>
            </div>
        
            <div class="d-flex justify-content-between align-items-center mb-4">
                <div class="form-check">
                    <input class="form-check-input" type="checkbox" name="remember" id="rememberMe">
                    <label class="form-check-label text-muted small" for="rememberMe">Remember Session</label>
                </div>
                <a href="forgot-password.html" class="auth-link small">Forgot Password?</a>
            </div>
        
            <button type="submit" class="btn btn-primary w-100 auth-btn mb-4">
                Sign In to Atelier <i class="bi bi-arrow-right ms-2"></i>
            </button>
        </form>
        
    </div>

</body>

</html>
