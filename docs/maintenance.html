<!DOCTYPE html>
<html lang="en">

<head>
    <script>window.XIVIG_ROOT = "./";</script>
    <meta charset="UTF-8">
    <title>Maintenance | Xivig Elite Architect</title>
    <meta name="description" content="System optimization in progress. Xivig architects are deploying core performance upgrades.">
    
    <!-- Site favicon -->
    <link rel="apple-touch-icon" sizes="180x180" href="./assets/apple-touch-icon.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="./assets/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="./assets/favicon-16x16.png" />
    
    <!-- Mobile Specific Metas -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    
    <!-- Instant Atelier Theme & Accent Initialization -->
    <script>
        (function() {
            try {
                const savedTheme = localStorage.getItem('xivig-global-theme') || 'light';
                const effectiveTheme = savedTheme === 'auto'
                    ? (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light')
                    : savedTheme;
                document.documentElement.setAttribute('data-bs-theme', effectiveTheme);
    
                const savedAccent = localStorage.getItem('xivig-accent-color') || '#4F6BFF';
                if (savedAccent) {
                    document.documentElement.style.setProperty('--elite-primary', savedAccent);
                    document.documentElement.style.setProperty('--xivig-primary', savedAccent);
                    document.documentElement.style.setProperty('--primary-accent', savedAccent);
                    document.documentElement.style.setProperty('--primary-hover', savedAccent);
                    document.documentElement.style.setProperty('--bs-primary', savedAccent);
                }
    
                const savedScale = localStorage.getItem('xivig-typography-scale');
                if (savedScale && savedScale !== '100') {
                    document.documentElement.style.fontSize = savedScale + '%';
                }
            } catch (e) {}
        })();
    </script>
    
    
    
    <!-- Google Fonts Elite Typography (Plus Jakarta Sans & Inter & JetBrains Mono) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Inter:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    
    <!-- Vendor Styles (Essential for Home) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
    
    <!-- Primary Theme SCSS (Render-blocking in Head to Prevent FOUC) -->
    
    
  <script type="module" crossorigin src="./assets/mobile-controller.js"></script>
  <script type="module" crossorigin src="./assets/rolldown-runtime.js"></script>
  <script type="module" crossorigin src="./assets/vendor-core.js"></script>
  <script type="module" crossorigin src="./assets/lightbox.js"></script>
  <script type="module" crossorigin src="./assets/pricing.js"></script>
  <script type="module" crossorigin src="./assets/xivig-core.js"></script>
  <script type="module" crossorigin src="./assets/maintenance2.js"></script>
  <script type="module" crossorigin src="./assets/home.js"></script>
  <link rel="stylesheet" crossorigin href="./assets/vendor-core.css">
  <link rel="stylesheet" crossorigin href="./assets/home.css">
</head>

<body class="home-layout maintenance-page" data-bs-spy="scroll" data-bs-target="#mainNav">

    

    <main >
        
        <style>
            /* Maintenance Page Architecture */
            .maintenance-container {
                min-height: 100vh;
                display: flex;
                align-items: center;
                justify-content: center;
                padding: 2rem;
                background: var(--bg-body);
                color: var(--text-main);
                font-family: 'Inter', sans-serif;
                transition: var(--transition-elite);
            }
        
            .glass-card {
                background: var(--card-bg);
                backdrop-filter: blur(25px);
                border: 1px solid var(--card-border);
                border-radius: 3rem;
                padding: 4rem;
                max-width: 850px;
                width: 100%;
                text-align: center;
                box-shadow: var(--card-shadow);
                position: relative;
                overflow: hidden;
            }
            
            .glass-card::before {
                content: '';
                position: absolute;
                top: -50%;
                left: -50%;
                width: 200%;
                height: 200%;
                background: var(--xv-canvas, #F4F6FB);
                opacity: 0.5;
                z-index: -1;
            }
        
            .status-badge {
                display: inline-flex;
                align-items: center;
                background: var(--elite-soft);
                color: var(--elite-primary);
                padding: 0.6rem 1.5rem;
                border-radius: 9999px;
                font-size: 0.85rem;
                font-weight: 700;
                margin-bottom: 2.5rem;
                border: 1px solid var(--card-border);
                text-transform: uppercase;
                letter-spacing: 1px;
            }
        
            .status-badge .dot {
                width: 10px;
                height: 10px;
                background: var(--elite-primary);
                border-radius: 50%;
                margin-right: 0.8rem;
                box-shadow: 0 0 15px var(--elite-primary);
                animation: pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
            }
        
            @keyframes pulse {
                0%, 100% { opacity: 1; transform: scale(1); }
                50% { opacity: 0.5; transform: scale(1.1); }
            }
        
            .maintenance-container h1 {
                font-size: clamp(2.5rem, 5vw, 4rem);
                font-weight: 900;
                margin-bottom: 1.5rem;
                letter-spacing: -0.04em;
                line-height: 1.1;
                color: var(--text-main);
            }
        
            .maintenance-container p {
                color: var(--text-muted);
                font-size: 1.2rem;
                line-height: 1.7;
                margin-bottom: 3.5rem;
                max-width: 650px;
                margin-left: auto;
                margin-right: auto;
            }
        
            /* Timer Engine */
            .timer-grid {
                display: grid;
                grid-template-columns: repeat(4, 1fr);
                gap: 1.5rem;
                margin-bottom: 3.5rem;
            }
        
            .timer-item {
                background: var(--bg-subtle);
                padding: 1.8rem 1rem;
                border-radius: 2rem;
                border: 1px solid var(--card-border);
                transition: transform 0.3s ease;
            }
            
            .timer-item:hover {
                transform: translateY(-5px);
                border-color: var(--elite-primary);
            }
        
            .timer-item h2 {
                font-size: clamp(1.8rem, 4vw, 2.8rem);
                font-weight: 800;
                margin-bottom: 0.2rem;
                color: var(--text-main);
                font-variant-numeric: tabular-nums;
            }
        
            .timer-item span {
                font-size: 0.7rem;
                text-transform: uppercase;
                letter-spacing: 0.15em;
                color: var(--text-muted);
                font-weight: 700;
            }
        
            /* Progress Architecture */
            .progress-container {
                height: 10px;
                background: var(--bg-subtle);
                border-radius: 9999px;
                margin-bottom: 3.5rem;
                overflow: hidden;
                border: 1px solid var(--card-border);
            }
        
            .progress-fill {
                height: 100%;
                background: var(--xv-brand, #4F6BFF);
                width: 0%;
                transition: width 1s cubic-bezier(0.4, 0, 0.2, 1);
                box-shadow: 0 0 20px var(--xivig-primary-glow);
            }
        
            /* Interactive Subscription (Integrated Single-Pill Form) */
            .subscribe-group {
                display: flex;
                align-items: center;
                max-width: 540px;
                margin: 0 auto 3.5rem;
                background: var(--bg-subtle, #ffffff);
                border: 1.5px solid var(--card-border, #e2e8f0);
                border-radius: 9999px;
                padding: 6px 6px 6px 24px;
                box-shadow: 0 4px 20px rgba(0, 0, 0, 0.04);
                transition: border-color 0.25s ease, box-shadow 0.25s ease;
            }
        
            .subscribe-group:focus-within {
                border-color: var(--elite-primary);
                box-shadow: 0 0 0 4px var(--xivig-primary-glow, rgba(79, 107, 255, 0.15));
            }
        
            .subscribe-group input {
                flex: 1;
                min-width: 0;
                background: transparent !important;
                border: none !important;
                padding: 10px 14px 10px 0;
                color: var(--text-main);
                outline: none !important;
                box-shadow: none !important;
                font-weight: 500;
                font-size: 0.95rem;
            }
        
            .subscribe-group input::placeholder {
                color: var(--text-muted);
            }
        
            .subscribe-group button {
                background: var(--elite-primary);
                color: #fff;
                border: none;
                padding: 12px 28px;
                border-radius: 9999px;
                font-weight: 700;
                font-size: 0.92rem;
                cursor: pointer;
                transition: var(--transition-elite);
                box-shadow: 0 4px 14px rgba(79, 107, 255, 0.35);
                white-space: nowrap;
                display: inline-flex;
                align-items: center;
                justify-content: center;
            }
        
            .subscribe-group button:hover {
                transform: translateY(-1px);
                box-shadow: 0 8px 22px rgba(79, 107, 255, 0.45);
                filter: brightness(1.08);
            }
        
            /* Social Integration */
            .social-bar {
                display: flex;
                justify-content: center;
                gap: 2.5rem;
            }
        
            .social-bar a {
                color: var(--text-muted);
                font-size: 1.6rem;
                transition: var(--transition-elite);
            }
        
            .social-bar a:hover {
                color: var(--elite-primary);
                transform: scale(1.2);
            }
        
            @media (max-width: 768px) {
                .glass-card {
                    padding: 3rem 1.5rem;
                    border-radius: 2rem;
                }
        
                .timer-grid {
                    grid-template-columns: repeat(2, 1fr);
                    gap: 1rem;
                }
        
                .subscribe-group {
                    border-radius: 1.5rem;
                    padding: 8px;
                    flex-direction: column;
                    gap: 8px;
                }
                
                .subscribe-group input {
                    width: 100%;
                    text-align: center;
                    padding: 10px 14px;
                }
        
                .subscribe-group button {
                    width: 100%;
                    border-radius: 1.2rem;
                    padding: 12px 20px;
                }
            }
        </style>
        
        <div class="maintenance-container">
            <div class="glass-card" id="maintenance-card">
                <div class="status-badge">
                    <span class="dot"></span> System Optimization
                </div>
        
                <h1>Refining Excellence</h1>
                <p>Our architects are currently deploying an upgraded core engine. We'll be back online with enhanced performance shortly.
                </p>
        
                <div class="timer-grid">
                    <div id="daysBox" class="timer-item">
                        <h2 id="days">00</h2>
                        <span>Days</span>
                    </div>
                    <div id="hoursBox" class="timer-item">
                        <h2 id="hours">00</h2>
                        <span>Hours</span>
                    </div>
                    <div id="minutesBox" class="timer-item">
                        <h2 id="minutes">00</h2>
                        <span>Minutes</span>
                    </div>
                    <div id="secondsBox" class="timer-item">
                        <h2 id="seconds">00</h2>
                        <span>Seconds</span>
                    </div>
                </div>
        
                <div class="progress-container">
                    <div id="progressBar" class="progress-fill"></div>
                </div>
        
                <form class="subscribe-group">
                    <input type="email" placeholder="Enter your email for notification" required>
                    <button type="submit">Notify Me</button>
                </form>
        
                <div class="social-bar">
                    <a href="#"><i class="fa-brands fa-x-twitter"></i></a>
                    <a href="#"><i class="fa-brands fa-github"></i></a>
                    <a href="#"><i class="fa-brands fa-discord"></i></a>
                </div>
            </div>
        </div>
        
    </main>


    <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>

</body>

</html>
