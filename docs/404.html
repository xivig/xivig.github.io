<!DOCTYPE html>
<html lang="en">

<head>
    <script>window.XIVIG_ROOT = "./";</script>
    <meta charset="UTF-8">
    <title>404 Page Not Found | XivigApp</title>
    
    <!-- Site favicon -->
    <link rel="apple-touch-icon" sizes="180x180" href="./assets/apple-touch-icon.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="./assets/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="./assets/favicon-16x16.png" />
    
    <!-- Mobile Specific Metas -->
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
    
    <!-- Instant Atelier Theme & Accent Initialization -->
    <script>
        (function() {
            try {
                const savedTheme = localStorage.getItem('xivig-global-theme') || 'light';
                const effectiveTheme = savedTheme === 'auto'
                    ? (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light')
                    : savedTheme;
                document.documentElement.setAttribute('data-bs-theme', effectiveTheme);
    
                const savedAccent = localStorage.getItem('xivig-accent-color') || '#4F6BFF';
                if (savedAccent) {
                    document.documentElement.style.setProperty('--elite-primary', savedAccent);
                    document.documentElement.style.setProperty('--xivig-primary', savedAccent);
                    document.documentElement.style.setProperty('--primary-accent', savedAccent);
                    document.documentElement.style.setProperty('--primary-hover', savedAccent);
                    document.documentElement.style.setProperty('--bs-primary', savedAccent);
                }
    
                const savedScale = localStorage.getItem('xivig-typography-scale');
                if (savedScale && savedScale !== '100') {
                    document.documentElement.style.fontSize = savedScale + '%';
                }
            } catch (e) {}
        })();
    </script>
    
    
    
    <!-- Google Fonts Elite Typography (Plus Jakarta Sans & Inter & JetBrains Mono) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Inter:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    
    <!-- Vendor Styles (Essential for Home) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
    
    <!-- Primary Theme SCSS (Render-blocking in Head to Prevent FOUC) -->
    
    
  <script type="module" crossorigin src="./assets/mobile-controller.js"></script>
  <script type="module" crossorigin src="./assets/rolldown-runtime.js"></script>
  <script type="module" crossorigin src="./assets/vendor-core.js"></script>
  <script type="module" crossorigin src="./assets/lightbox.js"></script>
  <script type="module" crossorigin src="./assets/pricing.js"></script>
  <script type="module" crossorigin src="./assets/xivig-core.js"></script>
  <script type="module" crossorigin src="./assets/maintenance2.js"></script>
  <script type="module" crossorigin src="./assets/home.js"></script>
  <link rel="stylesheet" crossorigin href="./assets/vendor-core.css">
  <link rel="stylesheet" crossorigin href="./assets/home.css">
</head>

<body class="home-layout error-page-404" data-bs-spy="scroll" data-bs-target="#mainNav">

    

    <main >
        
        <style>
            .error-page-404 {
                background-color: #f8fafc;
                min-height: 100vh;
                display: flex;
                align-items: center;
                justify-content: center;
                margin: 0;
                font-family: 'Inter', system-ui, -apple-system, sans-serif;
            }
        
            .error-card {
                background: #ffffff;
                border-radius: 2rem;
                padding: 4rem 2rem;
                box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.1);      
                max-width: 500px;
                width: 90%;
                text-align: center;
                border: 1px solid #e2e8f0;
            }
        
            .error-code {
                font-size: 8rem;
                font-weight: 900;
                line-height: 1;
                margin-bottom: 0;
                color: var(--elite-primary);
                letter-spacing: -0.05em;
            }
        
            .error-title {
                font-size: 1.5rem;
                font-weight: 700;
                color: #1e293b;
                margin-top: 1rem;
                margin-bottom: 1rem;
                text-transform: uppercase;
            }
        
            .error-message {
                color: #64748b;
                font-size: 1.1rem;
                line-height: 1.6;
                margin-bottom: 2.5rem;
            }
        
            .btn-home {
                background: #1e293b;
                color: #ffffff;
                padding: 1rem 2.5rem;
                border-radius: 9999px;
                font-weight: 600;
                text-decoration: none;
                transition: all 0.3s ease;
                display: inline-block;
                box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);       
            }
        
            .btn-home:hover {
                background: #0f172a;
                transform: translateY(-2px);
                box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1);       
                color: #ffffff;
            }
        
            /* Dark mode support */
            [data-bs-theme='dark'] .error-page-404 {
                background-color: #0f172a;
            }
            [data-bs-theme='dark'] .error-card {
                background: #1e293b;
                border-color: #334155;
                box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);      
            }
            [data-bs-theme='dark'] .error-title {
                color: #f1f5f9;
            }
            [data-bs-theme='dark'] .error-message {
                color: #94a3b8;
            }
            [data-bs-theme='dark'] .btn-home {
                background: #3b82f6;
            }
        </style>
        
        <div class="error-card">
            <h1 class="error-code">404</h1>
            <h3 class="error-title">Page Not Found</h3>
            <p class="error-message">
                The page you are looking for might have been removed, had its name changed, or is temporarily unavailable.
            </p>
            <a href="index.html" class="btn btn-home">
                Back To Home
            </a>
        </div>
        
    </main>


    <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>

</body>

</html>
