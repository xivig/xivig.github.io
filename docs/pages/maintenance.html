    <!-- Theme Detection & Critical Style Initialization (Prevents flashing) -->
    <script>
        (function() {
            const savedTheme = localStorage.getItem('xivig-global-theme') || 'dark';
            document.documentElement.setAttribute('data-bs-theme', savedTheme);
            // Set body background color immediately to prevent white flash
            const bgColor = savedTheme === 'dark' ? '#0b0f12' : '#f8fafc';
            document.write(`<style>body{background-color: ${bgColor} !important; visibility: hidden;} body.is-loaded, body.preloader-active{visibility: visible;}</style>`);
        })();
    </script>
    
    <!-- Critical Preloader Style (Prevents FOUC/Flash) -->
    <style>
        .preloader {
            position: fixed;
            inset: 0;
            z-index: 99999;
            background: inherit; /* Use the body background color */
            display: flex;
            align-items: center;
            justify-content: center;
            transition: opacity 0.6s ease, visibility 0.6s;
        }
        .preloader--hidden {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }
        body:not(.is-loaded) {
            overflow: hidden;
        }
        /* Ensure preloader is visible even if body is hidden */
        .preloader { visibility: visible !important; }
    </style>
    
    <script>
        document.addEventListener("DOMContentLoaded", function() {
            document.body.classList.add('preloader-active');
        });
    </script>

<body>

    <div class="maintenance-container">
        <div class="glass-card" id="maintenance-card">
            <div class="status-badge">
                <span class="dot"></span> System Optimization
            </div>

            <h1>We'll be back soon</h1>
            <p>Our team is currently deploying a major update to enhance your experience. We appreciate your patience.
            </p>

            <div class="timer-grid">
                <div id="daysBox" class="timer-item">
                    <h2 id="days">00</h2>
                    <span>Days</span>
                </div>
                <div id="hoursBox" class="timer-item">
                    <h2 id="hours">00</h2>
                    <span>Hours</span>
                </div>
                <div id="minutesBox" class="timer-item">
                    <h2 id="minutes">00</h2>
                    <span>Mins</span>
                </div>
                <div id="secondsBox" class="timer-item">
                    <h2 id="seconds">00</h2>
                    <span>Secs</span>
                </div>
            </div>

            <div class="progress-container">
                <div id="progressBar" class="progress-fill"></div>
            </div>

            <form class="subscribe-group">
                <input type="email" placeholder="Email address" required>
                <button type="submit">Notify Me</button>
            </form>

            <div class="social-bar">

                <a href="#"><i class="fa-brands fa-github"></i></a>
                <a href="#"><i class="fa-brands fa-discord"></i></a>
