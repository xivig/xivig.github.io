<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Maintenance | XivigApp</title>
    
    <!-- Site favicon -->
    <link rel="apple-touch-icon" sizes="180x180" href="/assets/apple-touch-icon.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/assets/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/assets/favicon-16x16.png" />
    
    <!-- Mobile Specific Metas -->
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
    
    <!-- Theme Detection & Critical Style Initialization -->
    <script>
        (function() {
            const savedTheme = localStorage.getItem('xivig-global-theme') || 'dark';
            document.documentElement.setAttribute('data-bs-theme', savedTheme);
            const bgColor = savedTheme === 'dark' ? '#0b0f12' : '#f8fafc';
            document.write(`<style>body{background-color: ${bgColor} !important; visibility: hidden;} body.is-loaded, body.preloader-active{visibility: visible;}</style>`);
        })();
    </script>
    
    <!-- Critical Preloader Style -->
    <style>
        .preloader {
            position: fixed;
            inset: 0;
            z-index: 99999;
            background: inherit;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: opacity 0.6s ease, visibility 0.6s;
        }
        .preloader--hidden {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }
        body:not(.is-loaded) {
            overflow: hidden;
        }
        .preloader { visibility: visible !important; }
    </style>
    
    <script>
        document.addEventListener("DOMContentLoaded", function() {
            document.body.classList.add('preloader-active');
        });
    </script>
    
    <!-- Vendor Styles (Essential for Home) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
  <script type="module" crossorigin src="/assets/preloader.js"></script>
  <script type="module" crossorigin src="/assets/rolldown-runtime.js"></script>
  <script type="module" crossorigin src="/assets/vendor-core.js"></script>
  <script type="module" crossorigin src="/assets/pricing.js"></script>
  <script type="module" crossorigin src="/assets/home.js"></script>
  <link rel="stylesheet" crossorigin href="/assets/preloader.css">
  <link rel="stylesheet" crossorigin href="/assets/vendor-core.css">
</head>

<body class="home-layout maintenance-page" data-bs-spy="scroll" data-bs-target="#mainNav">

    <!-- PRELOADER -->
    <div class="preloader">
        <div class="preloader__box text-center">
            <div class="preloader__logo mb-3">
                <img src="/assets/xivig-logo1.png" alt="Logo" width="120" />
            </div>
            <div class="preloader__progress">
                <div class="preloader__bar" id="bar1"></div>
            </div>
            <div class="preloader__percent" id="percent1">0%</div>
            <div class="preloader__text">Loading...</div>
        </div>
    </div>
    <div class="mobile-menu-overlay"></div>


    <main >
        
        <style>
            /* Maintenance Page Styles */
            .maintenance-container {
                min-height: 100vh;
                background: radial-gradient(circle at top right, #1e293b, #0f172a);
                display: flex;
                align-items: center;
                justify-content: center;
                padding: 2rem;
                color: #fff;
                font-family: 'Inter', sans-serif;
            }
        
            .glass-card {
                background: rgba(255, 255, 255, 0.03);
                backdrop-filter: blur(20px);
                border: 1px solid rgba(255, 255, 255, 0.1);
                border-radius: 2.5rem;
                padding: 4rem;
                max-width: 800px;
                width: 100%;
                text-align: center;
                box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            }
        
            .status-badge {
                display: inline-flex;
                align-items: center;
                background: rgba(59, 130, 246, 0.1);
                color: #60a5fa;
                padding: 0.5rem 1.25rem;
                border-radius: 9999px;
                font-size: 0.875rem;
                font-weight: 600;
                margin-bottom: 2rem;
                border: 1px solid rgba(59, 130, 246, 0.2);
            }
        
            .status-badge .dot {
                width: 8px;
                height: 8px;
                background: #3b82f6;
                border-radius: 50%;
                margin-right: 0.75rem;
                box-shadow: 0 0 12px #3b82f6;
                animation: pulse 2s infinite;
            }
        
            @keyframes pulse {
                0% { opacity: 1; }
                50% { opacity: 0.4; }
                100% { opacity: 1; }
            }
        
            .maintenance-container h1 {
                font-size: 3.5rem;
                font-weight: 800;
                margin-bottom: 1.5rem;
                letter-spacing: -0.025em;
                background: linear-gradient(to bottom right, #fff, #94a3b8);
                -webkit-background-clip: text;
                -webkit-text-fill-color: transparent;
            }
        
            .maintenance-container p {
                color: #94a3b8;
                font-size: 1.25rem;
                line-height: 1.75;
                margin-bottom: 3rem;
                max-width: 600px;
                margin-left: auto;
                margin-right: auto;
            }
        
            .timer-grid {
                display: grid;
                grid-template-columns: repeat(4, 1fr);
                gap: 1.5rem;
                margin-bottom: 3rem;
            }
        
            .timer-item {
                background: rgba(255, 255, 255, 0.05);
                padding: 1.5rem;
                border-radius: 1.5rem;
                border: 1px solid rgba(255, 255, 255, 0.05);
            }
        
            .timer-item h2 {
                font-size: 2.5rem;
                font-weight: 700;
                margin-bottom: 0.25rem;
                color: #fff;
            }
        
            .timer-item span {
                font-size: 0.75rem;
                text-transform: uppercase;
                letter-spacing: 0.1em;
                color: #64748b;
                font-weight: 600;
            }
        
            .progress-container {
                height: 8px;
                background: rgba(255, 255, 255, 0.05);
                border-radius: 9999px;
                margin-bottom: 3rem;
                overflow: hidden;
            }
        
            .progress-fill {
                height: 100%;
                background: linear-gradient(90deg, #3b82f6, #2dd4bf);
                width: 0%;
                transition: width 1s ease-out;
            }
        
            .subscribe-group {
                display: flex;
                gap: 1rem;
                max-width: 500px;
                margin: 0 auto 3rem;
            }
        
            .subscribe-group input {
                flex: 1;
                background: rgba(255, 255, 255, 0.05);
                border: 1px solid rgba(255, 255, 255, 0.1);
                border-radius: 1rem;
                padding: 1rem 1.5rem;
                color: #fff;
                outline: none;
                transition: all 0.3s;
            }
        
            .subscribe-group input:focus {
                background: rgba(255, 255, 255, 0.08);
                border-color: #3b82f6;
            }
        
            .subscribe-group button {
                background: #3b82f6;
                color: #fff;
                border: none;
                padding: 1rem 2rem;
                border-radius: 1rem;
                font-weight: 600;
                cursor: pointer;
                transition: all 0.3s;
            }
        
            .subscribe-group button:hover {
                background: #2563eb;
                transform: translateY(-1px);
            }
        
            .social-bar {
                display: flex;
                justify-content: center;
                gap: 2rem;
            }
        
            .social-bar a {
                color: #64748b;
                font-size: 1.5rem;
                transition: color 0.3s;
            }
        
            .social-bar a:hover {
                color: #fff;
            }
        
            @media (max-width: 640px) {
                .maintenance-container h1 { font-size: 2.5rem; }
                .timer-grid { grid-template-columns: repeat(2, 1fr); }
                .glass-card { padding: 2rem; }
                .subscribe-group { flex-direction: column; }
            }
        </style>
        
        <div class="maintenance-container">
            <div class="glass-card" id="maintenance-card">
                <div class="status-badge">
                    <span class="dot"></span> System Optimization
                </div>
        
                <h1>We'll be back soon</h1>
                <p>Our team is currently deploying a major update to enhance your experience. We appreciate your patience.
                </p>
        
                <div class="timer-grid">
                    <div id="daysBox" class="timer-item">
                        <h2 id="days">00</h2>
                        <span>Days</span>
                    </div>
                    <div id="hoursBox" class="timer-item">
                        <h2 id="hours">00</h2>
                        <span>Hours</span>
                    </div>
                    <div id="minutesBox" class="timer-item">
                        <h2 id="minutes">00</h2>
                        <span>Mins</span>
                    </div>
                    <div id="secondsBox" class="timer-item">
                        <h2 id="seconds">00</h2>
                        <span>Secs</span>
                    </div>
                </div>
        
                <div class="progress-container">
                    <div id="progressBar" class="progress-fill"></div>
                </div>
        
                <form class="subscribe-group">
                    <input type="email" placeholder="Email address" required>
                    <button type="submit">Notify Me</button>
                </form>
        
                <div class="social-bar">
                    <a href="#"><i class="fa-brands fa-x-twitter"></i></a>
                    <a href="#"><i class="fa-brands fa-github"></i></a>
                    <a href="#"><i class="fa-brands fa-discord"></i></a>
                </div>
            </div>
        </div>
        
    </main>


    <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>

</body>

</html>
