<!DOCTYPE html>
<html lang="en">

<head>
    <script>window.XIVIG_ROOT = "./";</script>
    <meta charset="UTF-8">
    <title>Lockscreen | XivigApp</title>
    <meta name="description" content="Xivig Authentication — Enterprise identity management, user onboarding, and secure access portal.">
    
    <!-- Site favicon -->
    <link rel="apple-touch-icon" sizes="180x180" href="./assets/apple-touch-icon.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="./assets/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="./assets/favicon-16x16.png" />
    
    <!-- Mobile Specific Metas -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#101B33" />
    
    <!-- Instant Atelier Theme & Accent Initialization -->
    <script>
        (function() {
            try {
                const savedTheme = localStorage.getItem('xivig-global-theme') || 'light';
                const effectiveTheme = savedTheme === 'auto'
                    ? (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light')
                    : savedTheme;
                document.documentElement.setAttribute('data-bs-theme', effectiveTheme);
    
                const savedAccent = localStorage.getItem('xivig-accent-color') || '#4F6BFF';
                if (savedAccent) {
                    document.documentElement.style.setProperty('--elite-primary', savedAccent);
                    document.documentElement.style.setProperty('--xivig-primary', savedAccent);
                    document.documentElement.style.setProperty('--primary-accent', savedAccent);
                    document.documentElement.style.setProperty('--primary-hover', savedAccent);
                    document.documentElement.style.setProperty('--bs-primary', savedAccent);
                }
    
                const savedScale = localStorage.getItem('xivig-typography-scale');
                if (savedScale && savedScale !== '100') {
                    document.documentElement.style.fontSize = savedScale + '%';
                }
            } catch (e) {}
        })();
    </script>
    
    
    
    <!-- Google Fonts Elite Typography (Plus Jakarta Sans & Inter & JetBrains Mono) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Inter:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    
    <!-- Vendor Styles (Essential Only) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    
    <!-- Auth Theme SCSS (Render-blocking in Head to Prevent FOUC) -->
    
    
  <script type="module" crossorigin src="./assets/lockscreen.js"></script>
  <link rel="modulepreload" crossorigin href="./assets/mobile-controller.js">
  <link rel="modulepreload" crossorigin href="./assets/rolldown-runtime.js">
  <link rel="modulepreload" crossorigin href="./assets/vendor-core.js">
  <link rel="modulepreload" crossorigin href="./assets/auth.js">
  <link rel="stylesheet" crossorigin href="./assets/vendor-core.css">
  <link rel="stylesheet" crossorigin href="./assets/auth.css">
</head>

<body class="auth-page">

    
    <div class="auth-card animate__animated animate__zoomIn">
        
        <div class="lockscreen-card__avatar mx-auto mb-4">
            <img src="./assets/photo1.jpg" alt="User Avatar" class="rounded-circle border border-3 border-white shadow-sm" style="width: 100px; height: 100px; object-fit: cover;">
        </div>
        
        <h3 class="auth-card__title text-center">Welcome Back</h3>
        <p class="auth-card__subtitle text-center small mb-4">Please enter your password to unlock</p>
        
        <form action="index.html" class="mb-4">
            <div class="input-group rounded-pill overflow-hidden shadow-sm mb-3 border">
                <input type="password" class="form-control border-0 py-3 px-4 shadow-none" placeholder="Enter Password" required id="lockInput">
                <button class="btn border-0 px-3 d-flex align-items-center justify-content-center" type="submit" style="background: transparent;">
                    <i class="bi bi-arrow-right-circle-fill fs-2 text-primary"></i>
                </button>
            </div>
            <div class="text-center">
                <a href="login.html" class="auth-link small fw-bold">
                    Sign in as a different user
                </a>
            </div>
        </form>
        
        <div class="text-center">
            <span class="extra-small text-muted opacity-50 text-uppercase tracking-wider">
                &copy; 2026 Xivig Architect OS
            </span>
        </div>
        
        
    </div>

</body>

</html>
