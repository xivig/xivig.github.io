<!DOCTYPE html>
<html lang="en">

<head>
    <script>window.XIVIG_ROOT = "./";</script>
    <meta charset="UTF-8">
    <title>Forgot Password | Xivig Elite</title>
    
    <!-- Site favicon -->
    <link rel="apple-touch-icon" sizes="180x180" href="./assets/apple-touch-icon.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="./assets/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="./assets/favicon-16x16.png" />
    
    <!-- Mobile Specific Metas -->
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
    
    <!-- Instant Atelier Theme & Accent Initialization -->
    <script>
        (function() {
            try {
                const savedTheme = localStorage.getItem('xivig-global-theme') || 'light';
                const effectiveTheme = savedTheme === 'auto'
                    ? (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light')
                    : savedTheme;
                document.documentElement.setAttribute('data-bs-theme', effectiveTheme);
    
                const savedAccent = localStorage.getItem('xivig-accent-color') || '#4F6BFF';
                if (savedAccent) {
                    document.documentElement.style.setProperty('--elite-primary', savedAccent);
                    document.documentElement.style.setProperty('--xivig-primary', savedAccent);
                    document.documentElement.style.setProperty('--primary-accent', savedAccent);
                    document.documentElement.style.setProperty('--primary-hover', savedAccent);
                    document.documentElement.style.setProperty('--bs-primary', savedAccent);
                }
    
                const savedScale = localStorage.getItem('xivig-typography-scale');
                if (savedScale && savedScale !== '100') {
                    document.documentElement.style.fontSize = savedScale + '%';
                }
            } catch (e) {}
        })();
    </script>
    
    
    
    <!-- Google Fonts Elite Typography (Plus Jakarta Sans & Inter & JetBrains Mono) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Inter:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    
    <!-- Vendor Styles (Essential Only) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    
    <!-- Auth Theme SCSS (Render-blocking in Head to Prevent FOUC) -->
    
    
  <script type="module" crossorigin src="./assets/mobile-controller.js"></script>
  <script type="module" crossorigin src="./assets/rolldown-runtime.js"></script>
  <script type="module" crossorigin src="./assets/vendor-core.js"></script>
  <script type="module" crossorigin src="./assets/auth.js"></script>
  <link rel="stylesheet" crossorigin href="./assets/vendor-core.css">
  <link rel="stylesheet" crossorigin href="./assets/auth.css">
</head>

<body class="auth-page">

    
    <div class="auth-card animate__animated animate__zoomIn">
        
        <div class="text-center">
            <div class="mb-4">
                <i class="bi bi-shield-lock text-primary display-4"></i>
            </div>
            <h2 class="auth-card__title">Forgot Password?</h2>
            <p class="auth-card__subtitle">Enter your email and we'll send you a link to reset your password.</p>
        </div>
        
        <form action="reset-password.html">
            <div class="mb-4">
                <div class="input-group auth-input-group">
                    <span class="input-group-text"><i class="bi bi-envelope"></i></span>
                    <input type="email" class="form-control" placeholder="architect@xivig.com" required>
                </div>
            </div>
        
            <button type="submit" class="btn btn-primary w-100 py-3 rounded-3 fw-bold shadow-sm mb-4">
                Send Reset Link
            </button>
        
            <p class="text-center small text-muted mb-0">
                Wait, I remember! <a href="login.html" class="auth-link">Back to Login</a>
            </p>
        </form>
        
    </div>

</body>

</html>
