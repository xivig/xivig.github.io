<!DOCTYPE html>
<html lang="en">

<head>
    <script>window.XIVIG_ROOT = "./";</script>
    <meta charset="UTF-8">
    <title>403 Access Denied | XivigApp</title>
    
    <!-- Site favicon -->
    <link rel="apple-touch-icon" sizes="180x180" href="./assets/apple-touch-icon.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="./assets/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="./assets/favicon-16x16.png" />
    
    <!-- Mobile Specific Metas -->
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
    
    <!-- Theme Detection & Critical Style Initialization -->
    <script>
        (function() {
            const savedTheme = localStorage.getItem('xivig-global-theme') || 'dark';
            document.documentElement.setAttribute('data-bs-theme', savedTheme);
            const bgColor = savedTheme === 'dark' ? '#080b0e' : '#f8fafc';
            document.write(`<style>body{background-color: ${bgColor} !important; visibility: hidden;} body.is-loaded, body.preloader-active{visibility: visible;}</style>`);
        })();
    </script>
    
    <!-- Critical Preloader Style -->
    <style>
        .preloader {
            position: fixed;
            inset: 0;
            z-index: 99999;
            background: inherit;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: opacity 0.5s cubic-bezier(0.16, 1, 0.3, 1), transform 0.5s cubic-bezier(0.16, 1, 0.3, 1), filter 0.5s cubic-bezier(0.16, 1, 0.3, 1), visibility 0.5s;
        }
        .preloader--hidden {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
            transform: scale(1.04);
            filter: blur(8px);
        }
        body:not(.is-loaded) {
            overflow: hidden;
        }
        .preloader { visibility: visible !important; }
    </style>
    
    <script>
        document.addEventListener("DOMContentLoaded", function() {
            document.body.classList.add('preloader-active');
        });
    </script>
    
    <!-- Vendor Styles (Essential for Home) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
    
    <!-- Global jQuery Exposure (Critical for Plugins) -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script>
        window.jQuery = window.$ = jQuery;
    </script>
  <script type="module" crossorigin src="./assets/mobile-controller.js"></script>
  <script type="module" crossorigin src="./assets/rolldown-runtime.js"></script>
  <script type="module" crossorigin src="./assets/vendor-core.js"></script>
  <script type="module" crossorigin src="./assets/maintenance2.js"></script>
  <script type="module" crossorigin src="./assets/vendor-jquery.js"></script>
  <script type="module" crossorigin src="./assets/home.js"></script>
  <link rel="stylesheet" crossorigin href="./assets/vendor-core.css">
  <link rel="stylesheet" crossorigin href="./assets/home.css">
</head>

<body class="home-layout error-page-403" data-bs-spy="scroll" data-bs-target="#mainNav">

    <!-- PRELOADER (ELITE ARCHITECT EDITION) -->
    <div class="preloader" id="elite-preloader" aria-live="polite" aria-busy="true">
        <!-- Ambient Luminous Glow Orbs -->
        <div class="preloader__backdrop">
            <div class="preloader__aura preloader__aura--primary"></div>
            <div class="preloader__aura preloader__aura--cyan"></div>
        </div>
    
        <div class="preloader__box">
            <!-- Centerpiece: Orbital Ring Matrix + Glowing Core -->
            <div class="preloader__core-wrap">
                <div class="preloader__orbit preloader__orbit--outer"></div>
                <div class="preloader__orbit preloader__orbit--inner"></div>
                <div class="preloader__core-glow"></div>
                
                <div class="preloader__brand">
                    <img src="./assets/logo.png" alt="XIVIG" class="preloader__logo-img" />
                </div>
            </div>
    
            <!-- Brand Name & Telemetry Header -->
            <div class="preloader__identity">
                <span class="preloader__brand-title">XIVIG</span>
                <span class="preloader__brand-sub">ELITE ARCHITECTURE</span>
            </div>
    
            <!-- Futuristic Sleek Progress Capsule -->
            <div class="preloader__track-wrap">
                <div class="preloader__track">
                    <div class="preloader__bar" id="bar1">
                        <span class="preloader__bar-laser"></span>
                    </div>
                </div>
            </div>
    
            <!-- Dynamic Readout & Telemetry Status -->
            <div class="preloader__hud">
                <div class="preloader__percent" id="percent1">00%</div>
                <div class="preloader__status" id="preloader-status">
                    <span class="preloader__status-dot"></span>
                    <span class="preloader__status-text" id="preloader-text">INITIALIZING CORE...</span>
                </div>
            </div>
        </div>
    </div>
    <div class="mobile-menu-overlay"></div>


    <main >
        
        <style>
            .error-page-403 {
                background-color: #f8fafc;
                min-height: 100vh;
                display: flex;
                align-items: center;
                justify-content: center;
                margin: 0;
                font-family: 'Inter', system-ui, -apple-system, sans-serif;
            }
        
            .error-card {
                background: #ffffff;
                border-radius: 2rem;
                padding: 4rem 2rem;
                box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.1);
                max-width: 500px;
                width: 90%;
                text-align: center;
                border: 1px solid #e2e8f0;
            }
        
            .lock-icon {
                font-size: 4rem;
                margin-bottom: 1rem;
            }
        
            .error-code {
                font-size: 8rem;
                font-weight: 900;
                line-height: 1;
                margin-bottom: 0;
                background: linear-gradient(135deg, #f43f5e 0%, #fb923c 100%);
                -webkit-background-clip: text;
                -webkit-text-fill-color: transparent;
                letter-spacing: -0.05em;
            }
        
            .error-title {
                font-size: 1.5rem;
                font-weight: 700;
                color: #1e293b;
                margin-top: 1rem;
                margin-bottom: 1rem;
                text-transform: uppercase;
            }
        
            .error-message {
                color: #64748b;
                font-size: 1.1rem;
                line-height: 1.6;
                margin-bottom: 2.5rem;
            }
        
            .btn-home {
                background: #1e293b;
                color: #ffffff;
                padding: 1rem 2.5rem;
                border-radius: 9999px;
                font-weight: 600;
                text-decoration: none;
                transition: all 0.3s ease;
                display: inline-block;
                box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
            }
        
            .btn-home:hover {
                background: #0f172a;
                transform: translateY(-2px);
                box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1);
                color: #ffffff;
            }
        
            /* Dark mode support */
            [data-bs-theme='dark'] .error-page-403 {
                background-color: #0f172a;
            }
            [data-bs-theme='dark'] .error-card {
                background: #1e293b;
                border-color: #334155;
                box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            }
            [data-bs-theme='dark'] .error-title {
                color: #f1f5f9;
            }
            [data-bs-theme='dark'] .error-message {
                color: #94a3b8;
            }
            [data-bs-theme='dark'] .btn-home {
                background: #f43f5e;
            }
        </style>
        
        <div class="error-card">
            <div class="lock-icon">🔒</div>
            <h1 class="error-code">403</h1>
            <h3 class="error-title">Access Denied</h3>
            <p class="error-message">
                Sorry, you don't have permission to access this page.<br>
                Please contact your administrator or check your credentials.
            </p>
            <a href="index.html" class="btn btn-home">
                Back To Home
            </a>
        </div>
        
    </main>


    <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
