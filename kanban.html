{{#> admin-layout title="Kanban" }}

<div class="card border-0 shadow-sm rounded-4 overflow-hidden">

                        <div
                            class="card-header bg-white py-3 px-4 border-0 d-flex justify-content-center align-items-center">
                            <div class="text-center">
                                <h5 class="fw-bold mb-0">Kanban</h5>
                                <small class="text-muted">Overview and management of kanban</small>
                            </div>
                        </div>

                        <div class="card-body p-4">
                            <!--content goes here-->
                            <div class="container-fluid px-0">
                                <div class="kanban-wrapper pb-4">
                                    <div class="d-flex flex-nowrap gap-4 overflow-auto pb-3 custom-scroll px-2">

                                        <div class="kanban-column" style="min-width: 320px;">
                                            <div class="d-flex align-items-center justify-content-between mb-3 px-2">
                                                <h6 class="fw-800 mb-0 text-uppercase tracking-wider small">
                                                    <i class="bi bi-circle-fill text-secondary me-2 small"></i> To Do
                                                    <span
                                                        class="badge bg-white text-dark ms-2 border fw-bold shadow-sm">4</span>
                                                </h6>
                                                <button class="btn btn-sm btn-white shadow-sm rounded-circle addTaskBtn"
                                                    data-column="todo">
                                                    <i class="bi bi-plus-lg"></i>
                                                </button>
                                            </div>
                                            <div class="kanban-list d-flex flex-column gap-3" id="todo">
                                                <div
                                                    class="card border-0 shadow-sm border-start border-primary border-4 rounded-3 kanban-card">
                                                    <div class="card-body p-3">
                                                        <div class="d-flex justify-content-between mb-2">
                                                            <span
                                                                class="badge bg-primary-subtle text-primary small">Development</span>
                                                            <i class="bi bi-grip-vertical text-muted"></i>
                                                        </div>
                                                        <h6 class="fw-bold mb-2">Refactor Laravel Middleware</h6>
                                                        <p class="text-muted small mb-3">Optimize the authentication
                                                            guards for
                                                            xivig-app.</p>
                                                        <div
                                                            class="d-flex align-items-center justify-content-between mt-auto">
                                                            <img src="src/images/photo1.jpg"
                                                                class="rounded-circle border border-2 border-white"
                                                                width="28" height="28">
                                                            <small class="text-muted"><i
                                                                    class="bi bi-calendar-event me-1"></i> Apr
                                                                15</small>
                                                        </div>
                                                    </div>
                                                </div>
                                            </div>
                                        </div>

                                        <div class="kanban-column" style="min-width: 320px;">
                                            <div class="d-flex align-items-center justify-content-between mb-3 px-2">
                                                <h6 class="fw-800 mb-0 text-uppercase tracking-wider small">
                                                    <i class="bi bi-circle-fill text-primary me-2 small"></i> In
                                                    Progress
                                                </h6>
                                            </div>
                                            <div class="kanban-list d-flex flex-column gap-3" id="inprogress">
                                            </div>
                                        </div>

                                        <div class="kanban-column" style="min-width: 320px;">
                                            <div class="d-flex align-items-center justify-content-between mb-3 px-2">
                                                <h6 class="fw-800 mb-0 text-uppercase tracking-wider small">
                                                    <i class="bi bi-circle-fill text-warning me-2 small"></i> Review
                                                </h6>
                                            </div>
                                            <div class="kanban-list d-flex flex-column gap-3" id="review"></div>
                                        </div>

                                        <div class="kanban-column" style="min-width: 320px;">
                                            <div class="d-flex align-items-center justify-content-between mb-3 px-2">
                                                <h6 class="fw-800 mb-0 text-uppercase tracking-wider small">
                                                    <i class="bi bi-circle-fill text-success me-2 small"></i> Completed
                                                </h6>
                                            </div>
                                            <div class="kanban-list d-flex flex-column gap-3" id="completed"></div>
                                        </div>

                                    </div>
                                </div>
                            </div>

                        </div>
                    </div>

                

{{/admin-layout}}
