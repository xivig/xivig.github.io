{{#> admin-layout title="Tooltip & Popover" }}

<div class="card border-0 shadow-sm rounded-4 overflow-hidden">

                        <div
                            class="card-header bg-white py-3 px-4 border-0 d-flex justify-content-center align-items-center">
                            <div class="text-center">
                                <h5 class="fw-bold mb-0">Tooltip & Popover</h5>
                                <small class="text-muted">Overview and management of tooltip & popover</small>
                            </div>
                        </div>

                        <div class="card-body p-4">
                            <!--content goes here-->
                            <div class="row g-4">
                                <div class="col-lg-12 mb-4">
                                    <div class="xivig-card p-4 mb-30">
                                        <h4 class="h4 mb-4" style="color: #6366f1;">System Tooltips</h4>
                                        <div class="d-flex flex-wrap gap-3">
                                            <button type="button" class="btn btn-xivig-primary" data-bs-toggle="tooltip"
                                                data-bs-placement="top" title="Schedules & Appointments">
                                                Hover Top
                                            </button>

                                            <button type="button" class="btn btn-xivig-primary" data-bs-toggle="tooltip"
                                                data-bs-placement="right" title="Patient Records Encrypted">
                                                Hover Right
                                            </button>

                                            <button type="button" class="btn btn-xivig-primary" data-bs-toggle="tooltip"
                                                data-bs-placement="bottom" title="Gulp Pipeline Active">
                                                Hover Bottom
                                            </button>

                                            <button type="button" class="btn btn-xivig-primary" data-bs-toggle="tooltip"
                                                data-bs-placement="left" title="Global Intelligence Sync">
                                                Hover Left
                                            </button>
                                        </div>
                                    </div>
                                </div>

                            </div>
                            <div class="row g-4">
                                <div class="col-lg-12 mb-4">
                                    <div class="xivig-card p-4 mb-3">
                                        <h4 class="h4 mb-4" style="color: #6366f1;">Advanced Info Popovers</h4>
                                        <div class="d-flex flex-wrap gap-3">
                                            <button type="button" class="btn btn-xivig-outline" data-bs-container="body"
                                                data-bs-toggle="popover" data-bs-placement="top"
                                                title="Security Protocol"
                                                data-bs-content="Xivig Architect OS utilizes Pure ESM modules for maximum asset performance.">
                                                Info Top
                                            </button>

                                            <button type="button" class="btn btn-xivig-outline" data-bs-container="body"
                                                data-bs-toggle="popover" data-bs-placement="right"
                                                title="Hospital Stats"
                                                data-bs-content="Total Appointments: 1,240. System health is currently at 98%.">
                                                Info Right
                                            </button>

                                            <button type="button" class="btn btn-xivig-outline" data-bs-container="body"
                                                data-bs-toggle="popover" data-bs-placement="bottom"
                                                title="Node Distribution"
                                                data-bs-content="Live map tracking active across 14 distributed terminal points.">
                                                Info Bottom
                                            </button>
                                        </div>
                                    </div>
                                </div>

                            </div>
                        </div>
                    

{{/admin-layout}}
