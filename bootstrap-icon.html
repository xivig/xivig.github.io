{{#> admin-layout title="Bootstrap Icons" }}

<div class="card border-0 shadow-sm rounded-4 overflow-hidden">

                        <div
                            class="card-header bg-white py-3 px-4 border-0 d-flex justify-content-center align-items-center">
                            <div class="text-center">
                                <h5 class="fw-bold mb-0">Bootstrap Icons</h5>
                                <small class="text-muted">Comprehensive library of scalable vector icons</small>
                            </div>
                        </div>

                        <div class="card-body p-4">
                            <div class="search-icon-box bg-white box-shadow border-radius-10 mb-30 pd-20">
                                <div class="input-group input-group-lg border-radius-10 overflow-hidden shadow-sm">
                                    <span class="input-group-text bg-white border-end-0">
                                        <i class="bi bi-search text-primary"></i>
                                    </span>
                                    <input type="text" class="form-control border-start-0 ps-0 shadow-none"
                                        id="filter_input" placeholder="Search premium icons..."
                                        style="border-color: #dee2e6;">
                                </div>
                            </div>

                            <div id="filter_list">
                                <div class="icon-list pd-20 card-box mb-30 border-0 shadow-sm">
                                    <div class="row fontawesome-icon-list g-4" id="bsIconContainer">
                                        <!-- Icons will be loaded here via AJAX -->
                                        <div class="col-12 text-center py-5">
                                            <div class="spinner-border text-primary" role="status">
                                                <span class="visually-hidden">Loading icons...</span>
                                            </div>
                                            <p class="mt-2 text-muted">Loading 2,000+ icons...</p>
                                        </div>
                                    </div>
                                </div>
                            </div>

                        </div>
                    

{{/admin-layout}}
