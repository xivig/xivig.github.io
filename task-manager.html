{{#> admin-layout title="Task Manager" parentTitle="Apps" }}

<div class="task-manager-module">
    <header class="task-header">
        <div>
            <h4 class="mb-0 fw-800">Architect.OS</h4>
            <p class="text-muted small mb-0">Drag. Drop. Execute.</p>
        </div>

        <div class="d-flex gap-2 align-items-center">
            <input id="newTaskTitle" class="form-control-elite" placeholder="Task description..." style="width: 250px;" />
            <select id="newTaskAvatar" class="form-control-elite" style="width: 130px;">
                <option value="AL" data-color="#ff4757">AL (Design)</option>
                <option value="Dev" data-color="#2ed573">Dev (Code)</option>
                <option value="QA" data-color="#ffa502">QA (Test)</option>
            </select>
            <button id="addTaskBtn" class="btn btn-primary rounded-pill px-4 fw-bold">
                <i class="bi bi-plus-lg me-2"></i> Create
            </button>
        </div>
    </header>

    <div class="row">
        <div class="col-12">
            <div class="task-column mb-4 shadow-sm border-0">
                <div class="column-header">
                    <h5 class="mb-0 fw-bold">Active Sprint</h5>
                    <span class="column-tag text-primary">In Progress</span>
                </div>
                <div id="todayTasks"></div>
            </div>
        </div>

        <div class="col-md-6">
            <div class="task-column shadow-sm border-0">
                <div class="column-header">
                    <h5 class="mb-0 fw-bold">Queue</h5>
                    <span class="column-tag text-warning">Upcoming</span>
                </div>
                <div id="upcomingTasks"></div>
            </div>
        </div>

        <div class="col-md-6">
            <div class="task-column shadow-sm border-0">
                <div class="column-header">
                    <h5 class="mb-0 fw-bold">Archived</h5>
                    <span class="column-tag text-success">Finished</span>
                </div>
                <div id="completedTasks"></div>
            </div>
        </div>
    </div>
</div>

{{/admin-layout}}
