<!DOCTYPE html>
<html lang="en">

<head>
    {{> head title="2FA Verification | XivigApp" }}
</head>

<body class="auth-page">

    <div class="auth-card text-center">
        <div class="mb-4">
            <i class="fa-solid fa-shield-halved text-primary display-4 opacity-75"></i>
        </div>
        <h3 class="auth-card__title">Two-Step Verification</h3>
        <p class="auth-card__subtitle small">We sent a 6-digit code to <br><strong>+91 ******1234</strong></p>

        <div class="d-flex justify-content-between gap-2 my-4">
            <input type="text" class="form-control otp-input" maxlength="1">
            <input type="text" class="form-control otp-input" maxlength="1">
            <input type="text" class="form-control otp-input" maxlength="1">
            <input type="text" class="form-control otp-input" maxlength="1">
            <input type="text" class="form-control otp-input" maxlength="1">
            <input type="text" class="form-control otp-input" maxlength="1">
        </div>

        <button class="btn btn-primary btn-lg w-100 rounded-pill mb-4 shadow-sm">Verify Account</button>
        <p class="small text-muted mb-0">Didn't receive it? <a href="#" class="text-primary text-decoration-none fw-bold">Resend Code</a></p>
    </div>

    {{> scripts }}

</body>

</html>
