{{#> admin-layout title="Video Player" }}

<div class="card border-0 shadow-sm rounded-4 overflow-hidden">

                        <div
                            class="card-header bg-white py-3 px-4 border-0 d-flex justify-content-center align-items-center">
                            <div class="text-center">
                                <h5 class="fw-bold mb-0">Video Player</h5>
                                <small class="text-muted">Overview and management of video player</small>
                            </div>
                        </div>

                        <div class="card-body p-4">
                            <!--content goes here-->
                            <div class="row g-4">

                                <div class="col-12">
                                    <div class="media-card card border-0 shadow-lg rounded-4 overflow-hidden mb-4">
                                        <div class="media-card__header p-4 bg-white border-bottom">
                                            <h4 class="media-card__title fw-bold text-dark mb-1">Architecture Preview
                                            </h4>
                                            <p class="text-muted small mb-0">High-fidelity HTML5 Video Playback</p>
                                        </div>
                                        <div class="media-card__video p-3">
                                            <video
                                                poster="https://cdn.plyr.io/static/demo/View_From_A_Blue_Moon_Trailer-HD.jpg"
                                                class="js-player" playsinline controls>
                                                <source
                                                    src="https://storage.googleapis.com/gtv-videos-bucket/sample/BigBuckBunny.mp4"
                                                    type="video/mp4" />
                                            </video>
                                        </div>
                                    </div>
                                </div>

                                <div class="col-md-6">
                                    <div class="media-card card border-0 shadow-sm rounded-4 h-100">
                                        <div class="media-card__header p-4">
                                            <h6
                                                class="fw-800 text-uppercase extra-small tracking-wider text-primary mb-3">
                                                Audio Briefing</h6>
                                            <div class="media-card__audio">
                                                <audio class="js-player" controls>
                                                    <source
                                                        src="https://cdn.plyr.io/static/demo/Kishi_Bashi_-_It_All_Began_With_a_Burst.mp3"
                                                        type="audio/mp3" />
                                                </audio>
                                            </div>
                                        </div>
                                    </div>
                                </div>

                                <div class="col-md-6">
                                    <div class="media-card card border-0 shadow-sm rounded-4 h-100 overflow-hidden">
                                        <div class="media-card__header p-4">
                                            <h6
                                                class="fw-800 text-uppercase extra-small tracking-wider text-danger mb-3">
                                                Live Stream</h6>
                                            <div class="js-player rounded-3 overflow-hidden"
                                                data-plyr-provider="youtube" data-plyr-embed-id="fB00t4At0rk"></div>
                                        </div>
                                    </div>
                                </div>
                            </div>

                        </div>
                    

{{/admin-layout}}
