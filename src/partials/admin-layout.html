<!DOCTYPE html>
<html lang="en">

<head>
    {{> head title=title }}
</head>

<body class="d-flex flex-column min-vh-100" data-bs-spy="scroll" data-bs-target="#blog-toc" data-bs-offset="100">

    {{> preloader }}

    {{> header }}

    {{> sidebar }}

    {{> right-sidebar }}

    <main class="main mt-5">
        <div class="main__container container-fluid">
            
            <!-- Standardized Page Header -->
            <div class="page-header p-4 my-4 bg-white rounded shadow-sm border-bottom border-primary border-5 text-center">
                <h2 class="page-header__title h4 text-primary fw-bold mb-1">{{title}}</h2>
                <nav class="page-header__nav" aria-label="breadcrumb">
                    <ol class="breadcrumb mb-0 small justify-content-center">
                        <li class="breadcrumb__item">
                            <a href="index.html" class="breadcrumb__link">Home</a>
                        </li>
                        {{#if parentTitle}}
                        <li class="breadcrumb__item">
                            <a href="#" class="breadcrumb__link">{{parentTitle}}</a>
                        </li>
                        {{/if}}
                        <li class="breadcrumb__item breadcrumb__item--active text-primary fw-semibold" aria-current="page">{{title}}</li>
                    </ol>
                </nav>
            </div>

            <!-- Main Content Area -->
            {{> @partial-block }}

        </div>
    </main>

    {{> footer }}

    {{> scripts }}

</body>

</html>
