{{#> admin-layout title="FontAwesome Icons" }}

<div class="card border-0 shadow-lg rounded-4 overflow-hidden mb-4">
                        <div class="input-group input-group-lg">
                            <span class="input-group-text bg-white border-0 ps-4">
                                <i class="fa-solid fa-magnifying-glass text-primary fs-4"></i>
                            </span>
                            <input type="text" id="iconFilterInput" class="form-control border-0 py-4 ps-2"
                                placeholder="AJAX Search through 30,000+ style variations..." autocomplete="off">
                        </div>
                    </div>

                    <div id="iconContainer">
                        <div class="col-12 text-center py-5">
                            <div class="spinner-border text-primary" role="status">
                                <span class="visually-hidden">Loading icons...</span>
                            </div>
                            <p class="mt-2 text-muted">Loading entire library...</p>
                        </div>
                    

{{/admin-layout}}
