{{#> admin-layout title="E Charts" }}

<div class="row g-4">

                <div class="col-md-6">

                            <h5 class="card-title mb-0">Monthly Sales Performance</h5>
                        </div>
                        <div class="card-body">
                            <div id="barChart" style="height: 400px;"></div>
                        </div>
                    </div>
                </div>
                <!-- Mini Pie -->
                <div class="col-md-6">
                    <div class="card shadow-sm border-0 rounded-4">

                        </div>
                        <div class="card-body">
                            <div id="miniPie" style="height: 400px;"></div>

                    </div>
                </div>

                <div class="col-md-6">

                        </div>

                <!-- Device Categories -->
