{{#> admin-layout title="Checkout" parentTitle="Ecommerce" }}

<div class="container mt-5">
    <div class="row">
        <div class="col-md-8 offset-md-2">
            <h2 class="mb-4">Checkout</h2>
            <div class="card">
                <div class="card-body">
                    <h5 class="card-title">Order Summary</h5>
                    <div id="order-summary"></div>
                    <hr>
                    <h5 class="card-title">Payment</h5>
                    <form id="payment-form">
                        <div id="payment-element">
                        <!-- A Stripe Element will be inserted here. -->
                        </div>
                        <button id="submit" class="btn btn-primary mt-4">Pay now</button>
                        <div id="error-message" class="mt-2 text-danger"></div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://js.stripe.com/v3/"></script>

<script>
    document.addEventListener('DOMContentLoaded', async function () {
        const orderSummary = document.getElementById('order-summary');
        const cart = JSON.parse(localStorage.getItem('cart'));
        let subtotal = 0;

        if (cart) {
            cart.forEach(item => {
                const itemTotal = item.price * item.quantity;
                subtotal += itemTotal;
                orderSummary.innerHTML += `
                    <div class="d-flex justify-content-between">
                        <p>${item.name} x ${item.quantity}</p>
                        <p>$${itemTotal.toFixed(2)}</p>
                    </div>
                `;
            });
        }
        
        const tax = subtotal * 0.1;
        const total = subtotal + tax;
        
        orderSummary.innerHTML += `
            <hr>
            <div class="d-flex justify-content-between">
                <p>Subtotal</p>
                <p>$${subtotal.toFixed(2)}</p>
            </div>
            <div class="d-flex justify-content-between">
                <p>Tax (10%)</p>
                <p>$${tax.toFixed(2)}</p>
            </div>
            <div class="d-flex justify-content-between">
                <h5>Total</h5>
                <h5>$${total.toFixed(2)}</h5>
            </div>
        `;

        const stripe = Stripe('YOUR_STRIPE_KEY');
        
        const response = await fetch('http://127.0.0.1:8000/api/stripe/create-payment-intent', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
            },
            body: JSON.stringify({ cart: cart }),
        });
        const { clientSecret } = await response.json();

        const elements = stripe.elements({ clientSecret });
        const paymentElement = elements.create('payment');
        paymentElement.mount('#payment-element');

        const form = document.getElementById('payment-form');
        form.addEventListener('submit', async (event) => {
            event.preventDefault();

            const { error } = await stripe.confirmPayment({
                elements,
                confirmParams: {
                    return_url: window.location.origin + '/app/pages/ecommerce/payment-success.html',
                },
            });

            if (error) {
                const messageContainer = document.getElementById('error-message');
                messageContainer.textContent = error.message;
            }
        });
    });
</script>
{{/admin-layout}}
