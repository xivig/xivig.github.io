{{#> admin-layout title="Shopping Cart" parentTitle="Ecommerce" }}

<div class="row g-4">
    <!-- Cart Items Column -->
    <div class="col-lg-8">
        <div class="card border-0 shadow-sm rounded-4 overflow-hidden mb-4 glass-card">
            <div class="card-header bg-white bg-opacity-50 py-4 px-4 border-0 d-flex justify-content-between align-items-center">
                <div>
                    <h4 class="fw-black text-dark mb-1">Your Basket</h4>
                    <p class="text-muted small mb-0"><i class="bi bi-info-circle me-1"></i> You have <span id="cart-item-count" class="fw-bold text-primary">0 items</span> in your cart</p>
                </div>
                <button id="empty-cart-btn" class="btn btn-light btn-sm rounded-pill px-4 border text-muted fw-bold shadow-sm transition-all hover-shadow">
                    <i class="bi bi-trash3 me-2"></i> Empty Cart
                </button>
            </div>

            <div class="card-body p-0" id="cart-items-container">
                <!-- Cart items will be dynamically inserted here -->
            </div>

            <div class="card-footer bg-white bg-opacity-50 border-0 p-4">
                <a href="ecommerce-products.html" class="btn btn-light rounded-pill px-4 py-2 border fw-bold text-dark shadow-sm">
                    <i class="bi bi-arrow-left me-2"></i> Continue Shopping
                </a>
            </div>
        </div>
    </div>

    <!-- Order Summary Column -->
    <div class="col-lg-4">
        <div class="card border-0 shadow-lg rounded-4 overflow-hidden glass-card position-sticky summary-card" style="top: 100px;">
            <!-- Watermark Icon: Repositioned and dimmed to ensure content legibility -->
            <div class="position-absolute bottom-0 end-0 p-4 text-primary" style="opacity: 0.05; pointer-events: none; transform: translate(15%, 15%);">
                <i class="bi bi-bag-check" style="font-size: 9rem;"></i>
            </div>

            <div class="card-body p-4 p-md-5 position-relative z-index-2">
                <h4 class="fw-black mb-3 pb-2 border-bottom text-dark" style="border-bottom: 2px solid var(--card-border) !important;">Summary</h4>

                <div class="space-y-4">
                    <div class="d-flex justify-content-between align-items-center mb-3">
                        <span class="text-muted fw-medium">Subtotal</span>
                        <span id="summary-subtotal" class="fw-bold text-dark">$0.00</span>
                    </div>
                    <div class="d-flex justify-content-between align-items-center mb-3">
                        <span class="text-muted fw-medium">Estimated Tax</span>
                        <span id="summary-tax" class="fw-bold text-dark">$0.00</span>
                    </div>
                    <div class="d-flex justify-content-between align-items-center mb-4">
                        <span class="text-muted fw-medium">Shipping</span>
                        <span class="fw-bold text-success">Free</span>
                    </div>
                </div>

                <div class="p-3 bg-light rounded-4 mb-4 border">
                    <label class="apple-label text-muted mb-2" style="font-size: 0.6rem;">Promo Code</label>
                    <div class="input-group">
                        <input type="text" class="form-control bg-transparent border-0 text-dark shadow-none p-0 px-1" placeholder="Enter code">
                        <button class="btn btn-primary btn-sm rounded-pill px-3 fw-bold">Apply</button>
                    </div>
                </div>

                <div class="mt-4 pt-4 border-top" style="border-top-color: var(--card-border) !important;">
                    <div class="d-flex justify-content-between align-items-center mb-4">
                        <span class="h5 fw-bold mb-0 text-dark">Total</span>
                        <div class="text-end">
                            <h3 id="summary-total" class="fw-black text-primary mb-0">$0.00</h3>
                            <span class="text-muted extra-small">Includes VAT</span>
                        </div>
                    </div>

                    <a href="checkout.html" id="checkout-btn" class="btn btn-primary w-100 py-3 rounded-pill fw-bold shadow-primary text-uppercase tracking-widest mb-3 transition-all hover-translate-y">
                        Checkout Now <i class="bi bi-chevron-right ms-1"></i>
                    </a>

                    <div class="text-center">
                        <div class="d-flex justify-content-center gap-3 opacity-50 mb-3 text-dark">
                            <i class="bi bi-credit-card-2-front fs-4"></i>
                            <i class="bi bi-paypal fs-4"></i>
                            <i class="bi bi-apple fs-4"></i>
                        </div>
                        <small class="text-muted d-flex align-items-center justify-content-center gap-2">
                            <i class="bi bi-shield-lock-fill text-success"></i> Secure 256-bit Payment
                        </small>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script type="module">
  document.addEventListener('DOMContentLoaded', () => {
    const cartItemsContainer = document.getElementById('cart-items-container');
    const cartItemCount = document.getElementById('cart-item-count');
    const summarySubtotal = document.getElementById('summary-subtotal');
    const summaryTax = document.getElementById('summary-tax');
    const summaryTotal = document.getElementById('summary-total');
    const emptyCartBtn = document.getElementById('empty-cart-btn');

    let cart = [];

    // Fetch products and initialize cart
    fetch('http://127.0.0.1:8000/api/products')
      .then(response => response.json())
      .then(products => {
        // For demonstration, add all products to the cart initially
        cart = products.map(p => ({ ...p, quantity: 1 }));
        renderCart();
      });

    function renderCart() {
      cartItemsContainer.innerHTML = '';
      let subtotal = 0;

      cart.forEach(item => {
        const itemTotal = item.price * item.quantity;
        subtotal += itemTotal;

        const cartItem = document.createElement('div');
        cartItem.classList.add('cart-item', 'd-flex', 'align-items-center', 'justify-content-between', 'p-4', 'mx-2', 'my-2', 'border-bottom', 'border-opacity-10', 'border-light');
        cartItem.innerHTML = `
          <div class="d-flex align-items-center gap-4">
              <div class="bg-light p-2 rounded-4 border shadow-sm position-relative overflow-hidden" style="width: 100px; height: 100px;">
                  <img src="${item.image}" alt="${item.name}" class="w-100 h-100 rounded-3" style="object-fit: cover;">
              </div>
              <div>
                  <h6 class="fw-bold text-dark mb-1 fs-5">${item.name}</h6>
                  <p class="text-muted small mb-0">${item.category}</p>
              </div>
          </div>
          <div class="d-flex align-items-center gap-5">
              <div class="text-center">
                  <label class="apple-label mb-2" style="font-size: 0.6rem;">Quantity</label>
                  <div class="quantity-picker shadow-sm">
                      <button class="btn-qty decrease-qty" data-id="${item.id}"><i class="bi bi-dash"></i></button>
                      <input type="text" class="qty-input" value="${item.quantity}" readonly>
                      <button class="btn-qty increase-qty" data-id="${item.id}"><i class="bi bi-plus"></i></button>
                  </div>
              </div>
              <div class="text-end" style="min-width: 120px;">
                  <label class="apple-label mb-2" style="font-size: 0.6rem;">Total Price</label>
                  <h5 class="fw-black text-primary mb-0">$${itemTotal.toFixed(2)}</h5>
              </div>
              <button class="btn btn-white btn-sm rounded-circle shadow-sm border p-2 text-danger hover-bg-danger hover-text-white transition-all remove-item" data-id="${item.id}">
                  <i class="bi bi-x-lg"></i>
              </button>
          </div>
        `;
        cartItemsContainer.appendChild(cartItem);
      });

      updateSummary(subtotal);
      updateCartItemCount();
    }

    function updateSummary(subtotal) {
      const tax = subtotal * 0.1; // 10% tax
      const total = subtotal + tax;

      summarySubtotal.textContent = '$' + subtotal.toFixed(2);
      summaryTax.textContent = '$' + tax.toFixed(2);
      summaryTotal.textContent = '$' + total.toFixed(2);
    }
    
    function updateCartItemCount() {
        const totalItems = cart.reduce((sum, item) => sum + item.quantity, 0);
        cartItemCount.textContent = `${totalItems} items`;
    }

    cartItemsContainer.addEventListener('click', e => {
      const target = e.target;

      if (target.closest('.increase-qty')) {
        const id = parseInt(target.closest('.increase-qty').dataset.id);
        const item = cart.find(i => i.id === id);
        if (item) {
          item.quantity++;
          renderCart();
        }
      }

      if (target.closest('.decrease-qty')) {
        const id = parseInt(target.closest('.decrease-qty').dataset.id);
        const item = cart.find(i => i.id === id);
        if (item && item.quantity > 1) {
          item.quantity--;
          renderCart();
        }
      }

      if (target.closest('.remove-item')) {
        const id = parseInt(target.closest('.remove-item').dataset.id);
        cart = cart.filter(i => i.id !== id);
        renderCart();
      }
    });

    emptyCartBtn.addEventListener('click', () => {
        cart = [];
        renderCart();
    });

    const checkoutBtn = document.getElementById('checkout-btn');

    checkoutBtn.addEventListener('click', e => {
      e.preventDefault();
      localStorage.setItem('cart', JSON.stringify(cart));
      window.location.href = 'checkout.html';
    });
  });
</script>

{{/admin-layout}}
