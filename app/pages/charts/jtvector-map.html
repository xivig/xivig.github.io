{{#> admin-layout title="Vector Map" parentTitle="Charts" }}

<div class="card card-box border-0 shadow-sm rounded-4 overflow-hidden mb-4">
    <div class="card-header bg-transparent py-3 px-4 border-bottom border-light border-opacity-10 d-flex justify-content-between align-items-center">
        <div>
            <h5 class="fw-bold mb-0">Interactive Global Map</h5>
            <small class="text-muted">Real-time edge node distribution and status monitoring</small>
        </div>
        <div class="d-flex align-items-center gap-2">
            <span class="badge bg-success-subtle text-success rounded-pill px-3 py-1.5 extra-small fw-bold">
                <i class="bi bi-circle-fill me-1" style="font-size: 6px;"></i> 4 Active Clusters
            </span>
        </div>
    </div>
    <div class="card-body p-0">
        <div class="vector-map-module position-relative">
            <div class="map-info-panel position-absolute top-0 start-0 m-3 p-3 rounded-3 shadow-sm" style="background: rgba(15, 23, 42, 0.85); backdrop-filter: blur(8px); color: #ffffff; z-index: 10; font-size: 0.8rem;">
                <strong class="d-block mb-1">Global Intelligence Grid</strong>
                <div class="d-flex align-items-center gap-2 text-white-50">
                    <span class="badge bg-primary rounded-circle p-1"></span>
                    <span>142 Distributed Nodes Online</span>
                </div>
            </div>

            <div id="map-vector" class="map-container" style="border: none; border-radius: 0; min-height: 600px; height: 600px; width: 100%;"></div>
        </div>
    </div>
</div>

<!-- MapLibre GL CSS & JS (Scoped strictly to Vector Map Page) -->
<link href="https://unpkg.com/maplibre-gl@4.3.2/dist/maplibre-gl.css" rel="stylesheet"/>
<script src="https://unpkg.com/maplibre-gl@4.3.2/dist/maplibre-gl.js"></script>

{{/admin-layout}}
