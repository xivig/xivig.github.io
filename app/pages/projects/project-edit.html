{{#> admin-layout title="Edit Project" parentTitle="Projects" }}

<div class="row justify-content-center">
    <div class="col-lg-10">
        <div class="card border-0 shadow-sm rounded-4 overflow-hidden mb-5">
            <div class="card-header bg-white py-4 px-5 border-0">
                <div class="d-flex align-items-center justify-content-between">
                    <div>
                        <h4 class="fw-black text-dark mb-1">Edit Project: Elite Dashboard UI</h4>
                        <p class="text-muted small mb-0">Modify the project details and update the status</p>
                    </div>
                    <button class="btn btn-light btn-sm rounded-pill px-4 border" onclick="history.back()">
                        <i class="bi bi-arrow-left me-2"></i> Back
                    </button>
                </div>
            </div>

            <div class="card-body p-5 pt-0">
                <form id="editProjectForm">
                    <div class="row g-4">
                        <!-- Project Basic Info -->
                        <div class="col-12">
                            <label class="apple-label">Project Title</label>
                            <input type="text" class="form-control modern-input" value="Elite Dashboard UI" required>
                        </div>

                        <div class="col-md-6">
                            <label class="apple-label">Client Name</label>
                            <input type="text" class="form-control modern-input" value="XIVIG Corp">
                        </div>

                        <div class="col-md-6">
                            <label class="apple-label">Project Category</label>
                            <select class="form-select modern-input">
                                <option>Select Category</option>
                                <option>Web Development</option>
                                <option>Mobile App</option>
                                <option selected>UI/UX Design</option>
                                <option>Marketing</option>
                            </select>
                        </div>

                        <div class="col-md-6">
                            <label class="apple-label">Budget ($)</label>
                            <div class="input-group modern-input-group border rounded-3 overflow-hidden">
                                <span class="input-group-text bg-light border-0 px-3"><i class="bi bi-currency-dollar"></i></span>
                                <input type="number" class="form-control border-0 shadow-none py-2" value="12500">
                            </div>
                        </div>

                        <div class="col-md-6">
                            <label class="apple-label">Deadline</label>
                            <input type="date" class="form-control modern-input" value="2026-12-15">
                        </div>

                        <div class="col-12">
                            <label class="apple-label">Project Description</label>
                            <textarea class="form-control modern-input" rows="5">Developing a high-performance, aesthetically pleasing administrative dashboard for the next generation of XIVIG web applications.</textarea>
                        </div>

                        <div class="col-md-12">
                            <label class="apple-label">Project Status</label>
                            <div class="d-flex gap-4 pt-2">
                                <div class="form-check">
                                    <input class="form-check-input" type="radio" name="projectStatus" id="statusPlanning">
                                    <label class="form-check-label small" for="statusPlanning">Planning</label>
                                </div>
                                <div class="form-check">
                                    <input class="form-check-input" type="radio" name="projectStatus" id="statusInProgress" checked>
                                    <label class="form-check-label small" for="statusInProgress">In Progress</label>
                                </div>
                                <div class="form-check">
                                    <input class="form-check-input" type="radio" name="projectStatus" id="statusOnHold">
                                    <label class="form-check-label small" for="statusOnHold">On Hold</label>
                                </div>
                                <div class="form-check">
                                    <input class="form-check-input" type="radio" name="projectStatus" id="statusCompleted">
                                    <label class="form-check-label small" for="statusCompleted">Completed</label>
                                </div>
                            </div>
                        </div>

                        <div class="col-12 border-top pt-4 mt-5 text-end">
                            <button type="button" class="btn btn-light rounded-pill px-5 py-2 border me-2" onclick="history.back()">Cancel</button>
                            <button type="submit" class="btn btn-dark rounded-pill px-5 py-2 fw-bold shadow-sm">Save Changes</button>
                        </div>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>

{{/admin-layout}}
