{{#> home-layout title="400 Bad Request | XivigApp" bodyClass="error-page-400" hideHeader=true hideFooter=true }}

<style>
    .error-page-400 {
        background-color: #f8fafc;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        margin: 0;
        font-family: 'Inter', system-ui, -apple-system, sans-serif;
    }

    .error-card {
        background: #ffffff;
        border-radius: 2rem;
        padding: 4rem 2rem;
        box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.1);
        max-width: 500px;
        width: 90%;
        text-align: center;
        border: 1px solid #e2e8f0;
    }

    .error-code {
        font-size: 8rem;
        font-weight: 900;
        line-height: 1;
        margin-bottom: 0;
        background: linear-gradient(135deg, #6366f1 0%, #a855f7 100%);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        letter-spacing: -0.05em;
    }

    .error-title {
        font-size: 1.5rem;
        font-weight: 700;
        color: #1e293b;
        margin-top: 1rem;
        margin-bottom: 1rem;
        text-transform: uppercase;
    }

    .error-message {
        color: #64748b;
        font-size: 1.1rem;
        line-height: 1.6;
        margin-bottom: 2.5rem;
    }

    .btn-home {
        background: #1e293b;
        color: #ffffff;
        padding: 1rem 2.5rem;
        border-radius: 9999px;
        font-weight: 600;
        text-decoration: none;
        transition: all 0.3s ease;
        display: inline-block;
        box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
    }

    .btn-home:hover {
        background: #0f172a;
        transform: translateY(-2px);
        box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1);
        color: #ffffff;
    }

    /* Dark mode support */
    [data-bs-theme='dark'] .error-page-400 {
        background-color: #0f172a;
    }
    [data-bs-theme='dark'] .error-card {
        background: #1e293b;
        border-color: #334155;
        box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
    }
    [data-bs-theme='dark'] .error-title {
        color: #f1f5f9;
    }
    [data-bs-theme='dark'] .error-message {
        color: #94a3b8;
    }
    [data-bs-theme='dark'] .btn-home {
        background: #6366f1;
    }
</style>

<div class="error-card">
    <h1 class="error-code">400</h1>
    <h3 class="error-title">Bad Request</h3>
    <p class="error-message">
        Your browser sent a request that this server could not understand.<br>
        Please check your URL or try again later.
    </p>
    <a href="index.html" class="btn btn-home">
        Back To Home
    </a>
</div>

{{/home-layout}}
