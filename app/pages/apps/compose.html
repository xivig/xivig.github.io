{{#> admin-layout title="Compose" parentTitle="Apps" actionText="View Inbox" actionUrl="inbox.html" }}

<div class="row g-4">
    {{> mail-sidebar }}

    <main class="col-lg-9">
        <div class="compose card card-box border-0 shadow-sm rounded-4 overflow-hidden">
            <!-- Header -->
            <div class="compose__header card-header bg-transparent border-bottom border-light border-opacity-10 p-4">
                <div class="d-flex align-items-center justify-content-between">
                    <div class="d-flex align-items-center gap-2">
                        <span class="badge bg-primary-subtle text-primary rounded-pill px-2.5 py-1 extra-small fw-bold">DRAFT</span>
                        <h5 class="mb-0 fw-bold text-main">New Message</h5>
                    </div>
                    <div class="compose__controls d-flex align-items-center gap-2">
                        <button class="btn btn-sm btn-outline-secondary rounded-circle p-0 d-inline-flex align-items-center justify-content-center" style="width: 32px; height: 32px;" title="Full Screen"><i class="bi bi-fullscreen extra-small"></i></button>
                        <a href="inbox.html" class="btn btn-sm btn-outline-secondary rounded-circle p-0 d-inline-flex align-items-center justify-content-center text-decoration-none" style="width: 32px; height: 32px;" title="Close"><i class="bi bi-x-lg extra-small"></i></a>
                    </div>
                </div>
            </div>

            <!-- Body Form -->
            <div class="compose__body card-body p-4">
                <form id="composeForm">
                    <div class="compose__field mb-3 d-flex align-items-center border-bottom border-light border-opacity-10 pb-2">
                        <span class="text-muted extra-small fw-bold text-uppercase me-3" style="width: 40px;">To</span>
                        <input type="email" id="composeToInput" class="form-control border-0 shadow-none bg-transparent ps-0" placeholder="architect@xivig.com" value="architect@xivig.com" required>
                        <span class="text-primary extra-small fw-bold" style="cursor: pointer;">Cc/Bcc</span>
                    </div>

                    <div class="compose__field mb-4 d-flex align-items-center border-bottom border-light border-opacity-10 pb-2">
                        <span class="text-muted extra-small fw-bold text-uppercase me-3" style="width: 40px;">Sub</span>
                        <input type="text" class="form-control border-0 shadow-none bg-transparent ps-0" placeholder="Enter subject line..." required>
                    </div>

                    <div class="compose__editor-wrapper mb-4">
                        <textarea class="form-control border-0 shadow-none bg-transparent p-0 custom-scroll" rows="12" placeholder="Start writing your message..." style="resize: vertical; font-size: 0.95rem; line-height: 1.6;"></textarea>
                    </div>

                    <!-- Attachment Pod -->
                    <div class="compose__attachment p-3 rounded-4 border border-light border-opacity-10 d-flex align-items-center justify-content-between bg-light bg-opacity-30">
                        <div class="d-flex align-items-center gap-3">
                            <div class="rounded-circle bg-primary-subtle text-primary p-2 d-flex align-items-center justify-content-center" style="width: 36px; height: 36px;">
                                <i class="bi bi-paperclip fs-5"></i>
                            </div>
                            <div>
                                <span class="d-block small fw-bold text-main" id="attachmentFileName">Add Assets</span>
                                <small class="text-muted extra-small">Images, blueprints, or archives (Max 32MB)</small>
                            </div>
                        </div>
                        <input type="file" id="fileInput" class="d-none">
                        <button type="button" onclick="document.getElementById('fileInput').click()" class="btn btn-outline-secondary btn-sm rounded-pill px-3 extra-small fw-bold">
                            <i class="bi bi-folder2-open me-1"></i> Browse Files
                        </button>
                    </div>
                </form>
            </div>

            <!-- Footer Action Strip -->
            <div class="compose__footer card-footer bg-transparent p-4 border-top border-light border-opacity-10 d-flex justify-content-between align-items-center">
                <button type="button" class="btn btn-link text-danger text-decoration-none fw-bold p-0 d-inline-flex align-items-center gap-1 extra-small" id="discardBtn">
                    <i class="bi bi-trash3"></i> Discard
                </button>

                <div class="d-flex align-items-center gap-2">
                    <button type="button" class="btn btn-outline-secondary px-4 py-2 rounded-pill fw-semibold extra-small d-inline-flex align-items-center gap-2" id="saveDraftBtn">
                        <i class="bi bi-file-earmark-arrow-down"></i> Save Draft
                    </button>
                    <button type="submit" form="composeForm" class="btn btn-primary px-4 py-2 rounded-pill fw-bold shadow-sm extra-small d-inline-flex align-items-center gap-2" id="sendMessageBtn">
                        <span>Send Message</span>
                        <i class="bi bi-send-fill"></i>
                    </button>
                </div>
            </div>
        </div>
    </main>
</div>

{{/admin-layout}}
