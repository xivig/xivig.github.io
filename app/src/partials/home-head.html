<meta charset="UTF-8">
<title>{{title}}</title>

<!-- Site favicon -->
<link rel="apple-touch-icon" sizes="180x180" href="/app/src/images/apple-touch-icon.png" />
<link rel="icon" type="image/png" sizes="32x32" href="/app/src/images/favicon-32x32.png" />
<link rel="icon" type="image/png" sizes="16x16" href="/app/src/images/favicon-16x16.png" />

<!-- Mobile Specific Metas -->
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />

<!-- Theme Detection & Critical Style Initialization -->
<script>
    (function() {
        const savedTheme = localStorage.getItem('xivig-global-theme') || 'dark';
        document.documentElement.setAttribute('data-bs-theme', savedTheme);
        const bgColor = savedTheme === 'dark' ? '#0b0f12' : '#f8fafc';
        document.write(`<style>body{background-color: ${bgColor} !important; visibility: hidden;} body.is-loaded, body.preloader-active{visibility: visible;}</style>`);
    })();
</script>

<!-- Critical Preloader Style -->
<style>
    .preloader {
        position: fixed;
        inset: 0;
        z-index: 99999;
        background: inherit;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: opacity 0.6s ease, visibility 0.6s;
    }
    .preloader--hidden {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
    }
    body:not(.is-loaded) {
        overflow: hidden;
    }
    .preloader { visibility: visible !important; }
</style>

<script>
    document.addEventListener("DOMContentLoaded", function() {
        document.body.classList.add('preloader-active');
    });
</script>

<!-- Vendor Styles (Essential for Home) -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
<link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">

<!-- Global jQuery Exposure (Critical for Plugins) -->
<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script>
    window.jQuery = window.$ = jQuery;
</script>
