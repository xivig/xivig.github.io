<!-- PRELOADER (ELITE ARCHITECT EDITION) -->
<div class="preloader" id="elite-preloader" aria-live="polite" aria-busy="true">
    <!-- Ambient Luminous Glow Orbs -->
    <div class="preloader__backdrop">
        <div class="preloader__aura preloader__aura--primary"></div>
        <div class="preloader__aura preloader__aura--cyan"></div>
    </div>

    <div class="preloader__box">
        <!-- Centerpiece: Orbital Ring Matrix + Glowing Core -->
        <div class="preloader__core-wrap">
            <div class="preloader__orbit preloader__orbit--outer"></div>
            <div class="preloader__orbit preloader__orbit--inner"></div>
            <div class="preloader__core-glow"></div>
            
            <div class="preloader__brand">
                <img src="/app/src/images/logo.png" alt="XIVIG" class="preloader__logo-img" />
            </div>
        </div>

        <!-- Brand Name & Telemetry Header -->
        <div class="preloader__identity">
            <span class="preloader__brand-title">XIVIG</span>
            <span class="preloader__brand-sub">ELITE ARCHITECTURE</span>
        </div>

        <!-- Futuristic Sleek Progress Capsule -->
        <div class="preloader__track-wrap">
            <div class="preloader__track">
                <div class="preloader__bar" id="bar1">
                    <span class="preloader__bar-laser"></span>
                </div>
            </div>
        </div>

        <!-- Dynamic Readout & Telemetry Status -->
        <div class="preloader__hud">
            <div class="preloader__percent" id="percent1">00%</div>
            <div class="preloader__status" id="preloader-status">
                <span class="preloader__status-dot"></span>
                <span class="preloader__status-text" id="preloader-text">INITIALIZING CORE...</span>
            </div>
        </div>
    </div>
</div>
<div class="mobile-menu-overlay"></div>
