<meta charset="UTF-8">
<title>{{title}}</title>
{{#if description}}
<meta name="description" content="{{description}}">
{{else}}
<meta name="description" content="Xivig — High-performance, production-ready Bootstrap 5 admin dashboard template, UI design system, and analytics application.">
{{/if}}

<!-- Site favicon -->
<link rel="apple-touch-icon" sizes="180x180" href="/app/src/images/apple-touch-icon.png" />
<link rel="icon" type="image/png" sizes="32x32" href="/app/src/images/favicon-32x32.png" />
<link rel="icon" type="image/png" sizes="16x16" href="/app/src/images/favicon-16x16.png" />

<!-- Mobile Specific Metas -->
<meta name="viewport" content="width=device-width, initial-scale=1.0" />

<!-- Instant Atelier Theme & Accent Initialization (Prevents FOUC) -->
<script>
    (function() {
        try {
            const savedTheme = localStorage.getItem('xivig-global-theme') || 'light';
            const effectiveTheme = savedTheme === 'auto'
                ? (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light')
                : savedTheme;
            document.documentElement.setAttribute('data-bs-theme', effectiveTheme);

            const savedAccent = localStorage.getItem('xivig-accent-color') || '#4F6BFF';
            if (savedAccent) {
                document.documentElement.style.setProperty('--elite-primary', savedAccent);
                document.documentElement.style.setProperty('--xivig-primary', savedAccent);
                document.documentElement.style.setProperty('--primary-accent', savedAccent);
                document.documentElement.style.setProperty('--primary-hover', savedAccent);
                document.documentElement.style.setProperty('--bs-primary', savedAccent);
            }

            const savedScale = localStorage.getItem('xivig-typography-scale');
            if (savedScale && savedScale !== '100') {
                document.documentElement.style.fontSize = savedScale + '%';
            }
        } catch (e) {}
    })();
</script>

<!-- Google Fonts DNS Prefetch & Preconnect for High-Speed Typography -->
<link rel="dns-prefetch" href="https://fonts.googleapis.com">
<link rel="dns-prefetch" href="https://fonts.gstatic.com">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<!-- Vendor Icon Styles (Lightweight font icons only) -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

<!-- Master SCSS Architecture -->
<link rel="stylesheet" href="/app/src/scss/vendors/vendors.scss">
<link rel="stylesheet" href="/app/src/scss/admin-bundle.scss">
