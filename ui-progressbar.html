{{#> admin-layout title="Progressbar" }}

<div class="card border-0 shadow-sm rounded-4 overflow-hidden">

                        <div
                            class="card-header bg-white py-3 px-4 border-0 d-flex justify-content-center align-items-center">
                            <div class="text-center">
                                <h5 class="fw-bold mb-0">Progressbar</h5>
                                <small class="text-muted">Overview and management of progressbar</small>
                            </div>
                        </div>

                        <div class="card-body p-4">
                            <!--content goes here-->

                            <div class="row g-4">
                                <div class="col-lg-4 col-md-6 mb-3">
                                    <div class="p-4 card-box h-100 border-0 shadow-sm rounded-4 bg-white">
                                        <h5 class="h6 fw-bold mb-3 text-dark">System Load & Labels</h5>
                                        <div class="progress elite-progress mb-4" style="height: 8px;">
                                            <div class="progress-bar glow-primary" role="progressbar"
                                                style="width: 25%"></div>
                                        </div>
                                        <div class="progress elite-progress mb-4" style="height: 20px;">
                                            <div class="progress-bar fw-bold" role="progressbar" style="width: 50%">50%
                                                Complete</div>
                                        </div>
                                        <div class="progress elite-progress" style="height: 8px;">
                                            <div class="progress-bar bg-dark" role="progressbar" style="width: 100%">
                                            </div>
                                        </div>
                                    </div>
                                </div>

                                <div class="col-lg-4 col-md-6 mb-3">
                                    <div class="p-4 card-box h-100 border-0 shadow-sm rounded-4 bg-white">
                                        <h5 class="h6 fw-bold mb-3 text-dark">Elite Status States</h5>
                                        <div class="progress elite-progress mb-4">
                                            <div class="progress-bar bg-success glow-success" role="progressbar"
                                                style="width: 15%"></div>
                                        </div>
                                        <div class="progress elite-progress mb-4">
                                            <div class="progress-bar bg-info glow-info" role="progressbar"
                                                style="width: 45%"></div>
                                        </div>
                                        <div class="progress elite-progress mb-4">
                                            <div class="progress-bar bg-warning glow-warning" role="progressbar"
                                                style="width: 65%"></div>
                                        </div>
                                        <div class="progress elite-progress">
                                            <div class="progress-bar bg-danger glow-danger" role="progressbar"
                                                style="width: 85%"></div>
                                        </div>
                                    </div>
                                </div>

                                <div class="col-lg-4 col-md-6 mb-3">
                                    <div class="p-4 card-box h-100 border-0 shadow-sm rounded-4 bg-white">
                                        <h5 class="h6 fw-bold mb-3 text-dark">Multi-Layer Architecture</h5>
                                        <p class="small text-muted mb-3">Resource distribution map</p>
                                        <div class="progress elite-progress mb-4" style="height: 12px;">
                                            <div class="progress-bar bg-primary" style="width: 30%"></div>
                                            <div class="progress-bar bg-info" style="width: 20%"></div>
                                            <div class="progress-bar bg-success" style="width: 15%"></div>
                                        </div>
                                        <div class="progress elite-progress" style="height: 12px;">
                                            <div class="progress-bar bg-danger" style="width: 40%"></div>
                                            <div class="progress-bar bg-warning" style="width: 25%"></div>
                                        </div>
                                    </div>
                                </div>

                                <div class="col-lg-4 col-md-6 mb-3">
                                    <div class="p-4 card-box h-100 border-0 shadow-sm rounded-4 bg-white">
                                        <h5 class="h6 fw-bold mb-3 text-dark">Active Pipelines</h5>
                                        <div class="progress elite-progress mb-4">
                                            <div class="progress-bar progress-bar-striped progress-bar-animated bg-primary"
                                                style="width: 75%">
                                            </div>
                                        </div>
                                        <div class="progress elite-progress mb-4">
                                            <div class="progress-bar progress-bar-striped progress-bar-animated bg-success"
                                                style="width: 50%">
                                            </div>
                                        </div>
                                        <div class="progress elite-progress">
                                            <div class="progress-bar progress-bar-striped progress-bar-animated bg-info"
                                                style="width: 90%"></div>
                                        </div>
                                    </div>
                                </div>

                                <div class="col-lg-8 col-md-12 mb-3">
                                    <div class="p-4 card-box h-100 border-0 shadow-sm rounded-4 bg-white">
                                        <h5 class="h6 fw-bold mb-3 text-dark">Architecture Build Precision</h5>
                                        <div class="row align-items-center mb-3">
                                            <div class="col-2 small fw-bold">UI Kit</div>
                                            <div class="col-10">
                                                <div class="progress elite-progress" style="height: 6px;">
                                                    <div class="progress-bar bg-primary" style="width: 80%"></div>
                                                </div>
                                            </div>
                                        </div>
                                        <div class="row align-items-center mb-0">
                                            <div class="col-2 small fw-bold">Nodes</div>
                                            <div class="col-10">
                                                <div class="progress elite-progress" style="height: 6px;">
                                                    <div class="progress-bar bg-info" style="width: 45%"></div>
                                                </div>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    

{{/admin-layout}}
