{{#> admin-layout title="ChartJS" }}
<div class="row g-4">
    <div class="col-md-6">
        <div class="card shadow-sm border-0 rounded-4">
            <div class="card-header bg-white border-0 py-3">
                <h5 class="card-title mb-0">Sales (Vertical Bar)</h5>
            </div>
            <div class="card-body" style="height: 300px;">
                <canvas id="verticalBar"></canvas>
            </div>
        </div>
    </div>

    <div class="col-md-6">
        <div class="card shadow-sm border-0 rounded-4">
            <div class="card-header bg-white border-0 py-3">
                <h5 class="card-title mb-0">Budget ($K)</h5>
            </div>
            <div class="card-body" style="height: 300px;">
                <canvas id="horizontalBar"></canvas>
            </div>
        </div>
    </div>

    <div class="col-md-6">
        <div class="card shadow-sm border-0 rounded-4">
            <div class="card-header bg-white border-0 py-3">
                <h5 class="card-title mb-0">Grouped Bar (2024 vs 2025)</h5>
            </div>
            <div class="card-body" style="height: 300px;">
                <canvas id="groupedBar"></canvas>
            </div>
        </div>
    </div>

    <div class="col-md-6">
        <div class="card shadow-sm border-0 rounded-4">
            <div class="card-header bg-white border-0 py-3">
                <h5 class="card-title mb-0">Stacked Bar (Traffic)</h5>
            </div>
            <div class="card-body" style="height: 300px;">
                <canvas id="stackedBar"></canvas>
            </div>
        </div>
    </div>

    <div class="col-md-6">
        <div class="card shadow-sm border-0 rounded-4">
            <div class="card-header bg-white border-0 py-3">
                <h5 class="card-title mb-0">Line Chart</h5>
            </div>
            <div class="card-body" style="height: 300px;">
                <canvas id="lineChart"></canvas>
            </div>
        </div>
    </div>

    <div class="col-md-6">
        <div class="card shadow-sm border-0 rounded-4">
            <div class="card-header bg-white border-0 py-3">
                <h5 class="card-title mb-0">Area Chart (Filled)</h5>
            </div>
            <div class="card-body" style="height: 300px;">
                <canvas id="areaChart"></canvas>
            </div>
        </div>
    </div>
</div>
{{/admin-layout}}
