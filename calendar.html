{{#> admin-layout title="Dashboard" }}

<div class="row g-4">
                        <div class="col-xl-3 col-lg-4">
                            <div class="card border-0 shadow-sm mb-4 rounded-3">
                                <div class="card-header bg-white py-3 border-bottom">
                                    <h6 class="mb-0 fw-bold">Draggable Events</h6>
                                </div>
                                <div class="card-body" id="external-events">
                                    <div class="fc-event bg-success text-white border-0 p-2 mb-2 rounded-2 cursor-move"
                                        data-class="bg-success">Lunch
                                    </div>
                                    <div class="fc-event bg-warning text-dark border-0 p-2 mb-2 rounded-2 cursor-move"
                                        data-class="bg-warning">Go home
                                    </div>
                                    <div class="fc-event bg-info text-white border-0 p-2 mb-2 rounded-2 cursor-move"
                                        data-class="bg-info">Do
                                        homework
                                    </div>
                                    <div class="fc-event bg-primary text-white border-0 p-2 mb-2 rounded-2 cursor-move"
                                        data-class="bg-primary">Work on UI design
                                    </div>
                                    <div class="fc-event bg-danger text-white border-0 p-2 mb-3 rounded-2 cursor-move"
                                        data-class="bg-danger">Sleep tight
                                    </div>

                                    <div class="form-check small mt-3">
                                        <input class="form-check-input" type="checkbox" id="drop-remove">
                                        <label class="form-check-label text-muted" for="drop-remove">Remove after
                                            drop</label>
                                    </div>
                                </div>
                            </div>

                            <div class="card border-0 shadow-sm rounded-3">
                                <div class="card-header bg-white py-3 border-bottom">
                                    <h6 class="mb-0 fw-bold">Create Event</h6>
                                </div>
                                <div class="card-body">
                                    <div class="d-flex gap-1 mb-3" id="event-color-picker">
                                        <button class="btn btn-primary p-2 rounded-1 border-0 color-btn"
                                            style="width: 25px; height: 25px;"></button>
                                        <button class="btn btn-warning p-2 rounded-1 border-0 color-btn"
                                            style="width: 25px; height: 25px;"></button>
                                        <button class="btn btn-success p-2 rounded-1 border-0 color-btn"
                                            style="width: 25px; height: 25px;"></button>
                                        <button class="btn btn-danger p-2 rounded-1 border-0 color-btn"
                                            style="width: 25px; height: 25px;"></button>
                                        <button class="btn btn-secondary p-2 rounded-1 border-0 color-btn"
                                            style="width: 25px; height: 25px;"></button>
                                    </div>
                                    <div class="input-group">
                                        <input type="text" class="form-control border-end-0 bg-light"
                                            placeholder="Event Title" id="new-event-title">
                                        <button class="btn btn-primary px-3 fw-bold" id="add-new-event">Add</button>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <div class="col-xl-9 col-lg-8">
                            <div class="card border-0 shadow-sm rounded-3">
                                <div class="card-body p-4">
                                    <div id="calendar"></div>
                                </div>
                            </div>
                        </div>
                    

{{/admin-layout}}
