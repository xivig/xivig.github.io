<!DOCTYPE html>
<html lang="en">

<head>
    <script>window.XIVIG_ROOT = "../../";</script>
    <script>window.XIVIG_ROOT = "../../";</script>
    <meta charset="UTF-8">
    <title>503 Service Unavailable | XivigApp</title>
    
    <!-- Site favicon -->
    <link rel="apple-touch-icon" sizes="180x180" href="../../assets/apple-touch-icon.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="../../assets/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="../../assets/favicon-16x16.png" />
    
    <!-- Mobile Specific Metas -->
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
    
    <!-- Theme Detection & Critical Style Initialization -->
    <script>
        (function() {
            const savedTheme = localStorage.getItem('xivig-global-theme') || 'dark';
            document.documentElement.setAttribute('data-bs-theme', savedTheme);
            const bgColor = savedTheme === 'dark' ? '#0b0f12' : '#f8fafc';
            document.write(`<style>body{background-color: ${bgColor} !important; visibility: hidden;} body.is-loaded, body.preloader-active{visibility: visible;}</style>`);
        })();
    </script>
    
    <!-- Critical Preloader Style -->
    <style>
        .preloader {
            position: fixed;
            inset: 0;
            z-index: 99999;
            background: inherit;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: opacity 0.6s ease, visibility 0.6s;
        }
        .preloader--hidden {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }
        body:not(.is-loaded) {
            overflow: hidden;
        }
        .preloader { visibility: visible !important; }
    </style>
    
    <script>
        document.addEventListener("DOMContentLoaded", function() {
            document.body.classList.add('preloader-active');
        });
    </script>
    
    <!-- Vendor Styles (Essential for Home) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
    
    <!-- Global jQuery Exposure (Critical for Plugins) -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script>
        window.jQuery = window.$ = jQuery;
    </script>
  <script type="module" crossorigin src="../../assets/mobile-controller.js"></script>
  <script type="module" crossorigin src="../../assets/rolldown-runtime.js"></script>
  <script type="module" crossorigin src="../../assets/vendor-core.js"></script>
  <script type="module" crossorigin src="../../assets/maintenance.js"></script>
  <script type="module" crossorigin src="../../assets/vendor-jquery.js"></script>
  <script type="module" crossorigin src="../../assets/home.js"></script>
  <link rel="stylesheet" crossorigin href="../../assets/vendor-core.css">
  <link rel="stylesheet" crossorigin href="../../assets/home.css">
</head>

<body class="home-layout error-page-503" data-bs-spy="scroll" data-bs-target="#mainNav">

    <!-- PRELOADER -->
    <div class="preloader">
        <div class="preloader__box text-center">
            <div class="preloader__logo mb-3">
                <img src="../../assets/xivig-logo1.png" alt="Logo" width="120" />
            </div>
            <div class="preloader__progress">
                <div class="preloader__bar" id="bar1"></div>
            </div>
            <div class="preloader__percent" id="percent1">0%</div>
            <div class="preloader__text">Loading...</div>
        </div>
    </div>
    <div class="mobile-menu-overlay"></div>


    <main >
        
        <style>
            .error-page-503 {
                background-color: #f8fafc;
                min-height: 100vh;
                display: flex;
                align-items: center;
                justify-content: center;
                margin: 0;
                font-family: 'Inter', system-ui, -apple-system, sans-serif;
            }
        
            .status-card {
                background: #ffffff;
                border-radius: 2rem;
                padding: 3.5rem 2rem;
                box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.1);
                max-width: 520px;
                width: 90%;
                text-align: center;
                border: 1px solid #e2e8f0;
                border-bottom: 8px solid #0d9488;
            }
        
            .loader-dots {
                display: flex;
                justify-content: center;
                gap: 8px;
                margin-bottom: 25px;
            }
        
            .dot {
                width: 12px;
                height: 12px;
                background: #0d9488;
                border-radius: 50%;
                animation: blink 1.4s infinite both;
            }
        
            .dot:nth-child(2) {
                animation-delay: 0.2s;
            }
        
            .dot:nth-child(3) {
                animation-delay: 0.4s;
            }
        
            @keyframes blink {
                0%,
                80%,
                100% {
                    opacity: 0.2;
                    transform: scale(0.8);
                }
                40% {
                    opacity: 1;
                    transform: scale(1.2);
                }
            }
        
            .error-code {
                font-size: 7rem;
                font-weight: 900;
                color: #1e293b;
                line-height: 1;
                margin-bottom: 1rem;
                letter-spacing: -0.05em;
            }
        
            .status-title {
                font-size: 1.75rem;
                font-weight: 700;
                color: #334155;
                margin-bottom: 1rem;
            }
        
            .status-message {
                color: #64748b;
                font-size: 1.1rem;
                line-height: 1.6;
                margin-bottom: 2.5rem;
            }
        
            .btn-refresh {
                background: #1e293b;
                color: #ffffff;
                padding: 1rem 2.5rem;
                border-radius: 1rem;
                font-weight: 600;
                text-decoration: none;
                transition: all 0.3s ease;
                display: inline-block;
            }
        
            .btn-refresh:hover {
                background: #0d9488;
                transform: translateY(-2px);
                color: #ffffff;
            }
        
            /* Dark mode support */
            [data-bs-theme='dark'] .error-page-503 {
                background-color: #0f172a;
            }
            [data-bs-theme='dark'] .status-card {
                background: #1e293b;
                border-color: #334155;
                box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            }
            [data-bs-theme='dark'] .error-code {
                color: #f1f5f9;
            }
            [data-bs-theme='dark'] .status-title {
                color: #f1f5f9;
            }
            [data-bs-theme='dark'] .status-message {
                color: #94a3b8;
            }
            [data-bs-theme='dark'] .btn-refresh {
                background: #0d9488;
            }
        </style>
        
        <div class="status-card text-center">
            <div class="loader-dots">
                <div class="dot"></div>
                <div class="dot"></div>
                <div class="dot"></div>
            </div>
        
            <h1 class="error-code">503</h1>
            <h3 class="status-title">Service Unavailable</h3>
        
            <p class="status-message">
                We’re fine-tuning things to make your experience even better.<br>
                We'll be back online in just a few minutes!
            </p>
        
            <a href="index.html" class="btn btn-refresh">
                Try Again
            </a>
        </div>
        
    </main>


    <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>

</body>

</html>
