<!DOCTYPE html>
<html lang="en">

<head>
    <script>window.XIVIG_ROOT = "../";</script>
    <script>window.XIVIG_ROOT = "../";</script>
    <meta charset="UTF-8">
    <title>Maintenance | Xivig Elite Architect</title>
    
    <!-- Site favicon -->
    <link rel="apple-touch-icon" sizes="180x180" href="../assets/apple-touch-icon.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="../assets/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="../assets/favicon-16x16.png" />
    
    <!-- Mobile Specific Metas -->
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
    
    <!-- Theme Detection & Critical Style Initialization -->
    <script>
        (function() {
            const savedTheme = localStorage.getItem('xivig-global-theme') || 'dark';
            document.documentElement.setAttribute('data-bs-theme', savedTheme);
            const bgColor = savedTheme === 'dark' ? '#0b0f12' : '#f8fafc';
            document.write(`<style>body{background-color: ${bgColor} !important; visibility: hidden;} body.is-loaded, body.preloader-active{visibility: visible;}</style>`);
        })();
    </script>
    
    <!-- Critical Preloader Style -->
    <style>
        .preloader {
            position: fixed;
            inset: 0;
            z-index: 99999;
            background: inherit;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: opacity 0.6s ease, visibility 0.6s;
        }
        .preloader--hidden {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }
        body:not(.is-loaded) {
            overflow: hidden;
        }
        .preloader { visibility: visible !important; }
    </style>
    
    <script>
        document.addEventListener("DOMContentLoaded", function() {
            document.body.classList.add('preloader-active');
        });
    </script>
    
    <!-- Vendor Styles (Essential for Home) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
    
    <!-- Global jQuery Exposure (Critical for Plugins) -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script>
        window.jQuery = window.$ = jQuery;
    </script>
  <script type="module" crossorigin src="../assets/preloader.js"></script>
  <script type="module" crossorigin src="../assets/rolldown-runtime.js"></script>
  <script type="module" crossorigin src="../assets/vendor-core.js"></script>
  <script type="module" crossorigin src="../assets/maintenance.js"></script>
  <script type="module" crossorigin src="../assets/vendor-jquery.js"></script>
  <script type="module" crossorigin src="../assets/home.js"></script>
  <link rel="stylesheet" crossorigin href="../assets/preloader.css">
  <link rel="stylesheet" crossorigin href="../assets/vendor-core.css">
</head>

<body class="home-layout maintenance-page" data-bs-spy="scroll" data-bs-target="#mainNav">

    <!-- PRELOADER -->
    <div class="preloader">
        <div class="preloader__box text-center">
            <div class="preloader__logo mb-3">
                <img src="../assets/xivig-logo1.png" alt="Logo" width="120" />
            </div>
            <div class="preloader__progress">
                <div class="preloader__bar" id="bar1"></div>
            </div>
            <div class="preloader__percent" id="percent1">0%</div>
            <div class="preloader__text">Loading...</div>
        </div>
    </div>
    <div class="mobile-menu-overlay"></div>


    <main >
        
        <style>
            /* Maintenance Page Architecture */
            .maintenance-container {
                min-height: 100vh;
                display: flex;
                align-items: center;
                justify-content: center;
                padding: 2rem;
                background: var(--bg-body);
                color: var(--text-main);
                font-family: 'Inter', sans-serif;
                transition: var(--transition-elite);
            }
        
            .glass-card {
                background: var(--card-bg);
                backdrop-filter: blur(25px);
                border: 1px solid var(--card-border);
                border-radius: 3rem;
                padding: 4rem;
                max-width: 850px;
                width: 100%;
                text-align: center;
                box-shadow: var(--card-shadow);
                position: relative;
                overflow: hidden;
            }
            
            .glass-card::before {
                content: '';
                position: absolute;
                top: -50%;
                left: -50%;
                width: 200%;
                height: 200%;
                background: radial-gradient(circle at center, var(--xivig-primary-glow) 0%, transparent 70%);
                opacity: 0.5;
                z-index: -1;
            }
        
            .status-badge {
                display: inline-flex;
                align-items: center;
                background: var(--elite-soft);
                color: var(--elite-primary);
                padding: 0.6rem 1.5rem;
                border-radius: 9999px;
                font-size: 0.85rem;
                font-weight: 700;
                margin-bottom: 2.5rem;
                border: 1px solid var(--card-border);
                text-transform: uppercase;
                letter-spacing: 1px;
            }
        
            .status-badge .dot {
                width: 10px;
                height: 10px;
                background: var(--elite-primary);
                border-radius: 50%;
                margin-right: 0.8rem;
                box-shadow: 0 0 15px var(--elite-primary);
                animation: pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
            }
        
            @keyframes pulse {
                0%, 100% { opacity: 1; transform: scale(1); }
                50% { opacity: 0.5; transform: scale(1.1); }
            }
        
            .maintenance-container h1 {
                font-size: clamp(2.5rem, 5vw, 4rem);
                font-weight: 900;
                margin-bottom: 1.5rem;
                letter-spacing: -0.04em;
                line-height: 1.1;
                color: var(--text-main);
            }
        
            .maintenance-container p {
                color: var(--text-muted);
                font-size: 1.2rem;
                line-height: 1.7;
                margin-bottom: 3.5rem;
                max-width: 650px;
                margin-left: auto;
                margin-right: auto;
            }
        
            /* Timer Engine */
            .timer-grid {
                display: grid;
                grid-template-columns: repeat(4, 1fr);
                gap: 1.5rem;
                margin-bottom: 3.5rem;
            }
        
            .timer-item {
                background: var(--bg-subtle);
                padding: 1.8rem 1rem;
                border-radius: 2rem;
                border: 1px solid var(--card-border);
                transition: transform 0.3s ease;
            }
            
            .timer-item:hover {
                transform: translateY(-5px);
                border-color: var(--elite-primary);
            }
        
            .timer-item h2 {
                font-size: clamp(1.8rem, 4vw, 2.8rem);
                font-weight: 800;
                margin-bottom: 0.2rem;
                color: var(--text-main);
                font-variant-numeric: tabular-nums;
            }
        
            .timer-item span {
                font-size: 0.7rem;
                text-transform: uppercase;
                letter-spacing: 0.15em;
                color: var(--text-muted);
                font-weight: 700;
            }
        
            /* Progress Architecture */
            .progress-container {
                height: 10px;
                background: var(--bg-subtle);
                border-radius: 9999px;
                margin-bottom: 3.5rem;
                overflow: hidden;
                border: 1px solid var(--card-border);
            }
        
            .progress-fill {
                height: 100%;
                background: var(--primary-gradient);
                width: 0%;
                transition: width 1s cubic-bezier(0.4, 0, 0.2, 1);
                box-shadow: 0 0 20px var(--xivig-primary-glow);
            }
        
            /* Interactive Subscription */
            .subscribe-group {
                display: flex;
                gap: 0.8rem;
                max-width: 550px;
                margin: 0 auto 3.5rem;
            }
        
            .subscribe-group input {
                flex: 1;
                background: var(--bg-subtle);
                border: 1px solid var(--card-border);
                border-radius: 1.2rem;
                padding: 1.1rem 1.8rem;
                color: var(--text-main);
                outline: none;
                font-weight: 500;
                transition: var(--transition-elite);
            }
        
            .subscribe-group input:focus {
                border-color: var(--elite-primary);
                box-shadow: 0 0 0 4px var(--xivig-primary-glow);
            }
        
            .subscribe-group button {
                background: var(--elite-primary);
                color: #fff;
                border: 1px solid var(--elite-primary);
                padding: 1.1rem 2.2rem;
                border-radius: 1.2rem;
                font-weight: 700;
                cursor: pointer;
                transition: var(--transition-elite);
                box-shadow: 0 8px 20px rgba(99, 102, 241, 0.2);
            }
        
            .subscribe-group button:hover {
                transform: translateY(-2px);
                box-shadow: 0 12px 25px rgba(99, 102, 241, 0.3);
                filter: brightness(1.1);
            }
        
            /* Social Integration */
            .social-bar {
                display: flex;
                justify-content: center;
                gap: 2.5rem;
            }
        
            .social-bar a {
                color: var(--text-muted);
                font-size: 1.6rem;
                transition: var(--transition-elite);
            }
        
            .social-bar a:hover {
                color: var(--elite-primary);
                transform: scale(1.2);
            }
        
            @media (max-width: 768px) {
                .glass-card {
                    padding: 3rem 1.5rem;
                    border-radius: 2rem;
                }
        
                .timer-grid {
                    grid-template-columns: repeat(2, 1fr);
                    gap: 1rem;
                }
        
                .subscribe-group {
                    flex-direction: column;
                }
                
                .subscribe-group button {
                    width: 100%;
                }
            }
        </style>
        
        <div class="maintenance-container">
            <div class="glass-card" id="maintenance-card">
                <div class="status-badge">
                    <span class="dot"></span> System Optimization
                </div>
        
                <h1>Refining Excellence</h1>
                <p>Our architects are currently deploying an upgraded core engine. We'll be back online with enhanced performance shortly.
                </p>
        
                <div class="timer-grid">
                    <div id="daysBox" class="timer-item">
                        <h2 id="days">00</h2>
                        <span>Days</span>
                    </div>
                    <div id="hoursBox" class="timer-item">
                        <h2 id="hours">00</h2>
                        <span>Hours</span>
                    </div>
                    <div id="minutesBox" class="timer-item">
                        <h2 id="minutes">00</h2>
                        <span>Minutes</span>
                    </div>
                    <div id="secondsBox" class="timer-item">
                        <h2 id="seconds">00</h2>
                        <span>Seconds</span>
                    </div>
                </div>
        
                <div class="progress-container">
                    <div id="progressBar" class="progress-fill"></div>
                </div>
        
                <form class="subscribe-group">
                    <input type="email" placeholder="Enter your email for notification" required>
                    <button type="submit">Notify Me</button>
                </form>
        
                <div class="social-bar">
                    <a href="#"><i class="fa-brands fa-x-twitter"></i></a>
                    <a href="#"><i class="fa-brands fa-github"></i></a>
                    <a href="#"><i class="fa-brands fa-discord"></i></a>
                </div>
            </div>
        </div>
        
    </main>


    <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>

</body>

</html>
