    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
    
    <!-- Theme Detection (Prevents flashing) -->
    <script>
      document.addEventListener("DOMContentLoaded", function() {
        const savedTheme = localStorage.getItem('xivig-global-theme') || 'dark';
        document.body.setAttribute('data-bs-theme', savedTheme);
      });
    </script>
    
    <!-- Vendor Styles (Third Party) -->
    
    <!-- Master CSS (Core Architecture) -->

    <script src="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.6.2/cropper.min.js"></script>
    
    <!-- Dropzone.js v6 (Modern Media Upload) -->
    <link rel="stylesheet" href="https://unpkg.com/dropzone@6.0.0-beta.1/dist/dropzone.css">
    <script src="https://unpkg.com/dropzone@6.0.0-beta.1/dist/dropzone-min.js"></script>
    
    <!-- AOS (Animate On Scroll) -->
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@simonwep/pickr/dist/themes/classic.min.css"/>

    <link href="https://unpkg.com/maplibre-gl@4.3.2/dist/maplibre-gl.css" rel="stylesheet"/>
  <script type="module" crossorigin src="./assets/maintenance.js"></script>
  <link rel="modulepreload" crossorigin href="./assets/modulepreload-polyfill.js">
  <link rel="modulepreload" crossorigin href="./assets/rolldown-runtime.js">
  <link rel="modulepreload" crossorigin href="./assets/vendor-core.js">
  <link rel="modulepreload" crossorigin href="./assets/vendor-fullcalendar.js">
  <link rel="modulepreload" crossorigin href="./assets/vendor-chartjs.js">
  <link rel="modulepreload" crossorigin href="./assets/vendor-apexcharts.js">
  <link rel="modulepreload" crossorigin href="./assets/vendor-echarts.js">
  <link rel="modulepreload" crossorigin href="./assets/vendor-highcharts.js">
  <link rel="modulepreload" crossorigin href="./assets/custom_scripts.js">
  <link rel="stylesheet" crossorigin href="./assets/vendor-core.css">

  <link rel="stylesheet" crossorigin href="./assets/main.css">
  <link rel="stylesheet" crossorigin href="./assets/vendors.css">
</head>

<body>

    <div class="maintenance-container">
        <div class="glass-card">
            <div class="status-badge">
                <span class="dot"></span> System Optimization
            </div>

            <h1>We'll be back soon</h1>
            <p>Our team is currently deploying a major update to enhance your experience. We appreciate your patience.
            </p>

            <div class="timer-grid">
                <div id="daysBox" class="timer-item">
                    <h2 id="days">00</h2>
                    <span>Days</span>
                </div>
                <div id="hoursBox" class="timer-item">
                    <h2 id="hours">00</h2>
                    <span>Hours</span>
                </div>
                <div id="minutesBox" class="timer-item">
                    <h2 id="minutes">00</h2>
                    <span>Mins</span>
                </div>
                <div id="secondsBox" class="timer-item">
                    <h2 id="seconds">00</h2>
                    <span>Secs</span>
                </div>
            </div>

            <div class="progress-container">
                <div id="progressBar" class="progress-fill"></div>
            </div>

            <form class="subscribe-group">
                <input type="email" placeholder="Email address" required>
                <button type="submit">Notify Me</button>
            </form>

            <div class="social-bar">
                <a href="#"><i class="fa-brands fa-x-twitter"></i></a>
                <a href="#"><i class="fa-brands fa-github"></i></a>
                <a href="#"><i class="fa-brands fa-discord"></i></a>
            </div>
        </div>
    </div>

    <!-- Form Components Dependencies -->
    <script src="https://cdn.jsdelivr.net/npm/@simonwep/pickr/dist/pickr.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
    <script src="https://cdn.jsdelivr.net/npm/cleave.js@1.6.0/dist/cleave.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/cleave.js@1.6.0/dist/addons/cleave-phone.us.js"></script>
    <script src="https://unpkg.com/maplibre-gl@4.3.2/dist/maplibre-gl.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.0/Sortable.min.js"></script>
    
    <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>

</body>

</html>
