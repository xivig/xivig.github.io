    <style>
        .error-page-503 {
            background-color: #f8fafc;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0;
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
        }

        .status-card {
            background: #ffffff;
            border-radius: 2rem;
            padding: 3.5rem 2rem;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.1);
            max-width: 520px;
            width: 90%;
            text-align: center;
            border: 1px solid #e2e8f0;
            border-bottom: 8px solid #0d9488;
        }

        .loader-dots {
            display: flex;
            justify-content: center;
            gap: 8px;
            margin-bottom: 25px;
        }

        .dot {
            width: 12px;
            height: 12px;
            background: #0d9488;
            border-radius: 50%;
            animation: blink 1.4s infinite both;
        }

        .dot:nth-child(2) { animation-delay: 0.2s; }
        .dot:nth-child(3) { animation-delay: 0.4s; }

        @keyframes blink {
            0%, 80%, 100% { opacity: 0.2; transform: scale(0.8); }
            40% { opacity: 1; transform: scale(1.2); }
        }

        .error-code {
            font-size: 7rem;
            font-weight: 900;
            color: #1e293b;
            line-height: 1;
            margin-bottom: 1rem;
            letter-spacing: -0.05em;
        }

        .status-title {
            font-size: 1.75rem;
            font-weight: 700;
            color: #334155;
            margin-bottom: 1rem;
        }

        .status-message {
            color: #64748b;
            font-size: 1.1rem;
            line-height: 1.6;
            margin-bottom: 2.5rem;
        }

        .btn-refresh {
            background: #1e293b;
            color: #ffffff;
            padding: 1rem 2.5rem;
            border-radius: 1rem;
            font-weight: 600;
            text-decoration: none;
            transition: all 0.3s ease;
            display: inline-block;
        }

        .btn-refresh:hover {
            background: #0d9488;
            transform: translateY(-2px);
            color: #ffffff;
        }

        /* Dark mode support */
        [data-bs-theme="dark"] .error-page-503 {
            background-color: #0f172a;
        }
        [data-bs-theme="dark"] .status-card {
            background: #1e293b;
            border-color: #334155;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }
        [data-bs-theme="dark"] .error-code {
            color: #f1f5f9;
        }
        [data-bs-theme="dark"] .status-title {
            color: #f1f5f9;
        }
        [data-bs-theme="dark"] .status-message {
            color: #94a3b8;
        }
        [data-bs-theme="dark"] .btn-refresh {
            background: #0d9488;
        }
    </style>

            We'll be back online in just a few minutes!

        <a href="index.html" class="btn btn-refresh">
            Try Again
