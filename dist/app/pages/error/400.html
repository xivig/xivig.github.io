<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>400 Bad Request | XivigApp</title>
    
    <!-- Site favicon -->
    <link rel="apple-touch-icon" sizes="180x180" href="/assets/apple-touch-icon.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/assets/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/assets/favicon-16x16.png" />
    
    <!-- Mobile Specific Metas -->
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
    
    <!-- Theme Detection & Critical Style Initialization -->
    <script>
        (function() {
            const savedTheme = localStorage.getItem('xivig-global-theme') || 'dark';
            document.documentElement.setAttribute('data-bs-theme', savedTheme);
            const bgColor = savedTheme === 'dark' ? '#0b0f12' : '#f8fafc';
            document.write(`<style>body{background-color: ${bgColor} !important; visibility: hidden;} body.is-loaded, body.preloader-active{visibility: visible;}</style>`);
        })();
    </script>
    
    <!-- Critical Preloader Style -->
    <style>
        .preloader {
            position: fixed;
            inset: 0;
            z-index: 99999;
            background: inherit;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: opacity 0.6s ease, visibility 0.6s;
        }
        .preloader--hidden {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }
        body:not(.is-loaded) {
            overflow: hidden;
        }
        .preloader { visibility: visible !important; }
    </style>
    
    <script>
        document.addEventListener("DOMContentLoaded", function() {
            document.body.classList.add('preloader-active');
        });
    </script>
    
    <!-- Vendor Styles (Essential for Home) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
    
    <!-- Global jQuery Exposure (Critical for Plugins) -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script>
        window.jQuery = window.$ = jQuery;
    </script>
  <script type="module" crossorigin src="/assets/preloader.js"></script>
  <script type="module" crossorigin src="/assets/rolldown-runtime.js"></script>
  <script type="module" crossorigin src="/assets/vendor-core.js"></script>
  <script type="module" crossorigin src="/assets/pricing.js"></script>
  <script type="module" crossorigin src="/assets/home.js"></script>
  <link rel="stylesheet" crossorigin href="/assets/preloader.css">
  <link rel="stylesheet" crossorigin href="/assets/vendor-core.css">
</head>

<body class="home-layout error-page-400" data-bs-spy="scroll" data-bs-target="#mainNav">

    <!-- PRELOADER -->
    <div class="preloader">
        <div class="preloader__box text-center">
            <div class="preloader__logo mb-3">
                <img src="/assets/xivig-logo1.png" alt="Logo" width="120" />
            </div>
            <div class="preloader__progress">
                <div class="preloader__bar" id="bar1"></div>
            </div>
            <div class="preloader__percent" id="percent1">0%</div>
            <div class="preloader__text">Loading...</div>
        </div>
    </div>
    <div class="mobile-menu-overlay"></div>


    <main >
        
        <style>
            .error-page-400 {
                background-color: #f8fafc;
                min-height: 100vh;
                display: flex;
                align-items: center;
                justify-content: center;
                margin: 0;
                font-family: 'Inter', system-ui, -apple-system, sans-serif;
            }
        
            .error-card {
                background: #ffffff;
                border-radius: 2rem;
                padding: 4rem 2rem;
                box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.1);
                max-width: 500px;
                width: 90%;
                text-align: center;
                border: 1px solid #e2e8f0;
            }
        
            .error-code {
                font-size: 8rem;
                font-weight: 900;
                line-height: 1;
                margin-bottom: 0;
                background: linear-gradient(135deg, #6366f1 0%, #a855f7 100%);
                -webkit-background-clip: text;
                -webkit-text-fill-color: transparent;
                letter-spacing: -0.05em;
            }
        
            .error-title {
                font-size: 1.5rem;
                font-weight: 700;
                color: #1e293b;
                margin-top: 1rem;
                margin-bottom: 1rem;
                text-transform: uppercase;
            }
        
            .error-message {
                color: #64748b;
                font-size: 1.1rem;
                line-height: 1.6;
                margin-bottom: 2.5rem;
            }
        
            .btn-home {
                background: #1e293b;
                color: #ffffff;
                padding: 1rem 2.5rem;
                border-radius: 9999px;
                font-weight: 600;
                text-decoration: none;
                transition: all 0.3s ease;
                display: inline-block;
                box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
            }
        
            .btn-home:hover {
                background: #0f172a;
                transform: translateY(-2px);
                box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1);
                color: #ffffff;
            }
        
            /* Dark mode support */
            [data-bs-theme='dark'] .error-page-400 {
                background-color: #0f172a;
            }
            [data-bs-theme='dark'] .error-card {
                background: #1e293b;
                border-color: #334155;
                box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            }
            [data-bs-theme='dark'] .error-title {
                color: #f1f5f9;
            }
            [data-bs-theme='dark'] .error-message {
                color: #94a3b8;
            }
            [data-bs-theme='dark'] .btn-home {
                background: #6366f1;
            }
        </style>
        
        <div class="error-card">
            <h1 class="error-code">400</h1>
            <h3 class="error-title">Bad Request</h3>
            <p class="error-message">
                Your browser sent a request that this server could not understand.<br>
                Please check your URL or try again later.
            </p>
            <a href="index.html" class="btn btn-home">
                Back To Home
            </a>
        </div>
        
    </main>


    <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>

</body>

</html>
