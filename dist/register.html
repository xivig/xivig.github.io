<!DOCTYPE html>

<head>
    <meta charset="UTF-8">

    <!-- Site favicon -->
    <link rel="apple-touch-icon" sizes="180x180" href="./assets/apple-touch-icon.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="./assets/favicon-32x32.png" />

    <!-- Mobile Specific Metas -->
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
    
    <!-- Critical Preloader Style (Prevents FOUC/Flash) -->
    <style>
        .preloader {
            position: fixed;
            inset: 0;
            z-index: 99999;
            background: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: opacity 0.6s ease, visibility 0.6s;
        }
        .preloader--hidden {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }
        body:not(.is-loaded) {
            overflow: hidden;
        }
    </style>
    
    <!-- Theme Detection (Prevents flashing) -->
    <script>
      document.addEventListener("DOMContentLoaded", function() {
        const savedTheme = localStorage.getItem('xivig-global-theme') || 'dark';
        document.body.setAttribute('data-bs-theme', savedTheme);
      });
    </script>
    
    <!-- Vendor Styles (Third Party) -->
    
    <!-- Master CSS (Core Architecture) -->
    
    <!-- Components CSS (UI Elements) -->
    
    <!-- Cropper.js v1.6.2 (Compatibility for Elite Layout) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.6.2/cropper.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.6.2/cropper.min.js"></script>
    
    <!-- Dropzone.js v6 (Modern Media Upload) -->
    <link rel="stylesheet" href="https://unpkg.com/dropzone@6.0.0-beta.1/dist/dropzone.css">
    <script src="https://unpkg.com/dropzone@6.0.0-beta.1/dist/dropzone-min.js"></script>

    <!-- Form Components Dependencies -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@simonwep/pickr/dist/themes/classic.min.css"/>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css"/>
    
    <!-- Vector Map (MapLibre) -->
    <link href="https://unpkg.com/maplibre-gl@4.3.2/dist/maplibre-gl.css" rel="stylesheet"/>
    
    <!-- Global jQuery Exposure (Critical for Plugins) -->

        window.jQuery = window.$ = jQuery;
    </script>
    
    <!-- DataTables (Bootstrap 5) - Loaded AFTER jQuery -->

    <script src="https://cdn.datatables.net/responsive/3.0.3/js/responsive.bootstrap5.min.js"></script>
    
    <style>
        /* DataTables Elite Tweaks */
        .dataTables_wrapper .dataTables_filter .form-control {
            border-radius: 50px;
            padding: 0.4rem 1rem;
            background: #f8f9fa;
            border: 1px solid rgba(0,0,0,0.1);
            width: 250px;
        }
        .dataTables_wrapper .dataTables_length select {
            border-radius: 50px;
            padding-right: 1.5rem;
        }
        .dataTables_wrapper .pagination {
            margin-bottom: 0;
        }
        .dataTables_wrapper .pagination .page-item.active .page-link {
            background-color: var(--bs-primary);
            border-color: var(--bs-primary);
            color: #fff !important;
        }
        .dataTables_wrapper .pagination .page-link {
            border-radius: 50px !important;
            margin: 0 3px;
            min-width: 36px;
            height: 36px;
            padding: 0 14px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            color: #666;
            border: 1px solid #eee;
            text-decoration: none;
            font-size: 0.875rem;
            transition: all 0.2s;
            white-space: nowrap;
        }
        /* Keep single digits/icons as circles */
        .dataTables_wrapper .pagination .page-item:not(.previous):not(.next):not(.first):not(.last) .page-link {
            padding: 0;
            width: 36px;
        }
        /* Ensure Bootstrap badges can expand */
        .badge {
            display: inline-flex !important;
            align-items: center;
            justify-content: center;
            min-width: 20px;
            width: auto !important;
            height: auto !important;
        }
        .dataTables_info {
            font-size: 0.875rem;
            color: #6c757d;
            font-weight: 500;
        }

<body class="auth-page">

    <div class="auth-card animate__animated animate__fadeInUp">
        <div class="text-center">
            <h2 class="auth-card__title">Create Account</h2>
            <p class="auth-card__subtitle">Join the elite network of Xivig architects.</p>
        </div>

        <div class="social-auth">
            <a href="#" class="social-btn"><i class="fa-brands fa-github"></i></a>
            <a href="#" class="social-btn text-danger"><i class="fa-brands fa-google"></i></a>
            <a href="#" class="social-btn text-primary"><i class="fa-brands fa-linkedin-in"></i></a>
        </div>

        <div class="auth-divider">
            <span>OR REGISTER WITH EMAIL</span>
        </div>

        <form action="login.html">
            <div class="mb-4">
                <div class="input-group auth-input-group">
                    <span class="input-group-text"><i class="bi bi-person"></i></span>
                    <input type="text" class="form-control" placeholder="Full Name" required>
                </div>
            </div>

            <div class="mb-4">
                <div class="input-group auth-input-group">
                    <span class="input-group-text"><i class="bi bi-envelope"></i></span>
                    <input type="email" class="form-control" placeholder="architect@xivig.com" required>
                </div>
            </div>

            <div class="mb-4">
                <div class="input-group auth-input-group">
                    <span class="input-group-text"><i class="bi bi-shield-lock"></i></span>
                    <input type="password" class="form-control" placeholder="Create Password" required>
                </div>
            </div>

            <div class="mb-4">
                <div class="form-check">
                    <input class="form-check-input" type="checkbox" id="terms" required>
                    <label class="form-check-label small text-muted" for="terms">
                        I agree to the <a href="#" class="auth-link">Terms & Conditions</a>
                    </label>
                </div>
            </div>

            <button type="submit" class="btn btn-primary w-100 py-3 rounded-3 fw-bold shadow-sm mb-4">
                Register Now
            </button>

            <p class="text-center small text-muted mb-0">
                Already have an account? <a href="login.html" class="auth-link">Sign In</a>
            </p>
            </form>
            </div>

            <!-- Form Components Dependencies -->
            <script src="https://cdn.jsdelivr.net/npm/@simonwep/pickr/dist/pickr.min.js"></script>
            <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
            <script src="https://cdn.jsdelivr.net/npm/cleave.js@1.6.0/dist/cleave.min.js"></script>
            <script src="https://cdn.jsdelivr.net/npm/cleave.js@1.6.0/dist/addons/cleave-phone.us.js"></script>
            <script src="https://unpkg.com/maplibre-gl@4.3.2/dist/maplibre-gl.js"></script>
            <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.0/Sortable.min.js"></script>
            
            <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>            </body>

</html>
