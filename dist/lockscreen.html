<!DOCTYPE html>
<html lang="en">

<head>
    <script>window.XIVIG_ROOT = "./";</script>
    <meta charset="UTF-8">
    <title>Lockscreen | XivigApp</title>
    
    <!-- Site favicon -->
    <link rel="apple-touch-icon" sizes="180x180" href="./assets/apple-touch-icon.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="./assets/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="./assets/favicon-16x16.png" />
    
    <!-- Mobile Specific Metas -->
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
    
    <!-- Theme Detection & Critical Style Initialization -->
    <script>
        (function() {
            const savedTheme = localStorage.getItem('xivig-global-theme') || 'dark';
            document.documentElement.setAttribute('data-bs-theme', savedTheme);
            const bgColor = savedTheme === 'dark' ? '#080b0e' : '#f8fafc';
            document.write(`<style>body{background-color: ${bgColor} !important; visibility: hidden;} body.is-loaded, body.preloader-active{visibility: visible;}</style>`);
        })();
    </script>
    
    <!-- Critical Preloader Style -->
    <style>
        .preloader {
            position: fixed;
            inset: 0;
            z-index: 99999;
            background: inherit;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: opacity 0.5s cubic-bezier(0.16, 1, 0.3, 1), transform 0.5s cubic-bezier(0.16, 1, 0.3, 1), filter 0.5s cubic-bezier(0.16, 1, 0.3, 1), visibility 0.5s;
        }
        .preloader--hidden {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
            transform: scale(1.04);
            filter: blur(8px);
        }
        body:not(.is-loaded) {
            overflow: hidden;
        }
        .preloader { visibility: visible !important; }
    </style>
    
    <script>
        document.addEventListener("DOMContentLoaded", function() {
            document.body.classList.add('preloader-active');
        });
    </script>
    
    <!-- Vendor Styles (Essential Only) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    
    <!-- Global jQuery Exposure (Critical for Plugins) -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script>
        window.jQuery = window.$ = jQuery;
    </script>
  <script type="module" crossorigin src="./assets/lockscreen.js"></script>
  <link rel="modulepreload" crossorigin href="./assets/mobile-controller.js">
  <link rel="modulepreload" crossorigin href="./assets/rolldown-runtime.js">
  <link rel="modulepreload" crossorigin href="./assets/vendor-jquery.js">
  <link rel="modulepreload" crossorigin href="./assets/vendor-core.js">
  <link rel="modulepreload" crossorigin href="./assets/auth.js">
  <link rel="stylesheet" crossorigin href="./assets/vendor-core.css">
  <link rel="stylesheet" crossorigin href="./assets/auth.css">
</head>

<body class="auth-page">

    <!-- PRELOADER (ELITE ARCHITECT EDITION) -->
    <div class="preloader" id="elite-preloader" aria-live="polite" aria-busy="true">
        <!-- Ambient Luminous Glow Orbs -->
        <div class="preloader__backdrop">
            <div class="preloader__aura preloader__aura--primary"></div>
            <div class="preloader__aura preloader__aura--cyan"></div>
        </div>
    
        <div class="preloader__box">
            <!-- Centerpiece: Orbital Ring Matrix + Glowing Core -->
            <div class="preloader__core-wrap">
                <div class="preloader__orbit preloader__orbit--outer"></div>
                <div class="preloader__orbit preloader__orbit--inner"></div>
                <div class="preloader__core-glow"></div>
                
                <div class="preloader__brand">
                    <img src="./assets/logo.png" alt="XIVIG" class="preloader__logo-img" />
                </div>
            </div>
    
            <!-- Brand Name & Telemetry Header -->
            <div class="preloader__identity">
                <span class="preloader__brand-title">XIVIG</span>
                <span class="preloader__brand-sub">ELITE ARCHITECTURE</span>
            </div>
    
            <!-- Futuristic Sleek Progress Capsule -->
            <div class="preloader__track-wrap">
                <div class="preloader__track">
                    <div class="preloader__bar" id="bar1">
                        <span class="preloader__bar-laser"></span>
                    </div>
                </div>
            </div>
    
            <!-- Dynamic Readout & Telemetry Status -->
            <div class="preloader__hud">
                <div class="preloader__percent" id="percent1">00%</div>
                <div class="preloader__status" id="preloader-status">
                    <span class="preloader__status-dot"></span>
                    <span class="preloader__status-text" id="preloader-text">INITIALIZING CORE...</span>
                </div>
            </div>
        </div>
    </div>
    <div class="mobile-menu-overlay"></div>

    <div class="auth-card animate__animated animate__zoomIn">
        
        <div class="lockscreen-card__avatar mx-auto mb-4">
            <img src="./assets/photo1.jpg" alt="User Avatar" class="rounded-circle border border-3 border-white shadow-sm" style="width: 100px; height: 100px; object-fit: cover;">
        </div>
        
        <h3 class="auth-card__title text-center">Welcome Back</h3>
        <p class="auth-card__subtitle text-center small mb-4">Please enter your password to unlock</p>
        
        <form action="index.html" class="mb-4">
            <div class="input-group rounded-pill overflow-hidden shadow-sm mb-3 border">
                <input type="password" class="form-control border-0 py-3 px-4 shadow-none" placeholder="Enter Password" required id="lockInput">
                <button class="btn border-0 px-3 d-flex align-items-center justify-content-center" type="submit" style="background: transparent;">
                    <i class="bi bi-arrow-right-circle-fill fs-2 text-primary"></i>
                </button>
            </div>
            <div class="text-center">
                <a href="login.html" class="auth-link small fw-bold">
                    Sign in as a different user
                </a>
            </div>
        </form>
        
        <div class="text-center">
            <span class="extra-small text-muted opacity-50 text-uppercase tracking-wider">
                &copy; 2026 Xivig Architect OS
            </span>
        </div>
        
        
    </div>

</body>

</html>
