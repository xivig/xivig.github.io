{{#> admin-layout title="Advanced Components" parentTitle="Forms" }}

<div class="row">
    <div class="col-12">
        <div class="card border-0 shadow-sm p-4 mb-4 rounded-4">
            <div class="mb-4">
                <h5 class="fw-bold">Smart Selectors</h5>
                <p class="text-muted small">Search and multi-select integration powered by Select2</p>
            </div>
            <div class="row g-4">
                <div class="col-md-6">
                    <label class="form-label small fw-bold text-muted text-uppercase tracking-wider">Single
                        Selection</label>
                    <select class="form-select border-light bg-light rounded-3 py-2 custom-select2">
                        <option value="AK">Alaska</option>
                        <option value="HI">Hawaii</option>
                    </select>
                </div>
                <div class="col-md-6">
                    <label class="form-label small fw-bold text-muted text-uppercase tracking-wider">Multiple
                        Selection</label>
                    <select class="form-select border-light bg-light rounded-3 py-2 custom-select2"
                            multiple>
                        <option value="CA" selected>California</option>
                        <option value="NV" selected>Nevada</option>
                    </select>
                </div>
            </div>
        </div>

        <div class="row g-4 mb-4">
            <div class="col-md-6">
                <div class="card border-0 shadow-sm p-4 rounded-4">
                    <label class="form-label small fw-bold text-muted text-uppercase tracking-wider mb-3">Keywords
                        & Tags</label>
                    <div class="bg-light border border-light rounded-3 p-3 shadow-sm" id="tags-container"
                         style="min-height: 56px; display: flex; flex-wrap: wrap; gap: 10px; align-items: center;">

                        <input type="text"
                               class="form-control border-0 bg-transparent shadow-none p-0 ms-1"
                               id="tag-input"
                               placeholder="Add tag..."
                               style="flex: 1; min-width: 120px; font-size: 0.9rem;">
                    </div>
                    <input type="hidden" name="tags" id="hidden-tags" value="Laravel,Bootstrap,VanillaJS">
                    <div class="form-text mt-3 text-muted">
                        Press <kbd class="bg-white text-dark border shadow-sm px-2">Enter</kbd> to add.
                    </div>
                </div>
            </div>

            <div class="col-md-6">
                <div class="card border-0 shadow-sm p-4 rounded-4 h-100">
                    <label class="form-label small fw-bold text-muted text-uppercase tracking-wider mb-3">System
                        Controls</label>
                    <div class="list-group list-group-flush">
                        <div class="list-group-item border-0 bg-light rounded-3 d-flex justify-content-between align-items-center mb-2 p-3">
                            <span class="fw-medium text-dark">Public Access</span>
                            <div class="form-check form-switch m-0 p-0">
                                <input class="form-check-input ms-0" type="checkbox" role="switch" checked
                                       style="cursor: pointer;">
                            </div>
                        </div>
                        <div class="list-group-item border-0 bg-light rounded-3 d-flex justify-content-between align-items-center p-3">
                            <span class="fw-medium text-dark">Maintenance Mode</span>
                            <div class="form-check form-switch m-0 p-0">
                                <input class="form-check-input ms-0 bg-warning border-warning"
                                       type="checkbox" role="switch" style="cursor: pointer;">
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div class="card border-0 shadow-sm p-4 mb-4 rounded-4">
            <label class="form-label small fw-bold text-muted text-uppercase tracking-wider mb-3">Adjust
                Values</label>
            <div class="row g-3">
                <div class="col-md-4">
                    <div class="input-group">
                        <button class="btn btn-outline-light border text-dark px-3" type="button"
                                id="btn-minus">-
                        </button>
                        <input type="text" class="form-control text-center fw-bold bg-light border-light"
                               value="85" id="stepper-input">
                        <span class="input-group-text bg-white border-light fw-bold text-muted">%</span>
                        <button class="btn btn-outline-light border text-dark px-3" type="button"
                                id="btn-plus">+
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

{{/admin-layout}}

<script type="module">
    import { initAdvancedComponents } from './src/scripts/AdvancedComponents.js';
    document.addEventListener('DOMContentLoaded', () => {
        initAdvancedComponents();
    });
</script>
