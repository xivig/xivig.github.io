{{#> admin-layout title="Image Cropper" parentTitle="Forms" }}

<div class="row g-4">
    <!-- Header Section -->
    <div class="col-12">
        <div class="glass-card p-4 shadow-sm border-0 mb-4">
            <h2 class="display-6 fw-bold text-primary mb-1">Advanced Image Cropper</h2>
            <p class="text-muted lead small mb-0">Precise editing for your admin assets</p>
        </div>
    </div>

    <!-- Main Cropper Area -->
    <div class="col-12">
        <div class="card border-0 shadow-sm rounded-4 overflow-hidden">
            <div class="card-body p-4 p-md-5">
                <div class="row g-5">
                    <!-- Left: Cropping Area -->
                    <div class="col-xl-9 col-lg-8">
                        <div class="img-container rounded-4 overflow-hidden border bg-light shadow-inner position-relative" 
                             style="min-height: 500px; background-image: radial-gradient(#d1d1d6 1px, transparent 1px); background-size: 20px 20px;">
                            <img src="src/images/img1.jpg" id="image" alt="Picture" class="img-fluid">
                        </div>
                        
                        <!-- Toolbar at Bottom of Image -->
                        <div class="row mt-4 align-items-center" id="actions">
                            <div class="col-lg-9 docs-buttons d-flex flex-wrap gap-2">
                                <div class="btn-group shadow-sm">
                                    <button type="button" class="btn btn-outline-primary px-3" data-method="setDragMode" data-option="move" title="Move">
                                        <i class="bi bi-arrows-move"></i>
                                    </button>
                                    <button type="button" class="btn btn-outline-primary px-3" data-method="setDragMode" data-option="crop" title="Crop">
                                        <i class="bi bi-crop"></i>
                                    </button>
                                </div>

                                <div class="btn-group shadow-sm">
                                    <button type="button" class="btn btn-outline-primary px-3" data-method="zoom" data-option="0.1" title="Zoom In">
                                        <i class="bi bi-zoom-in"></i>
                                    </button>
                                    <button type="button" class="btn btn-outline-primary px-3" data-method="zoom" data-option="-0.1" title="Zoom Out">
                                        <i class="bi bi-zoom-out"></i>
                                    </button>
                                </div>

                                <div class="btn-group shadow-sm">
                                    <button type="button" class="btn btn-outline-primary px-3" data-method="rotate" data-option="-45" title="Rotate Left">
                                        <i class="bi bi-arrow-counterclockwise"></i>
                                    </button>
                                    <button type="button" class="btn btn-outline-primary px-3" data-method="rotate" data-option="45" title="Rotate Right">
                                        <i class="bi bi-arrow-clockwise"></i>
                                    </button>
                                </div>

                                <div class="btn-group shadow-sm ms-md-2">
                                    <label class="btn btn-primary px-4 d-flex align-items-center" for="inputImage">
                                        <input type="file" class="visually-hidden" id="inputImage" accept="image/*">
                                        <i class="bi bi-cloud-arrow-up-fill me-2"></i> Import
                                    </label>
                                    <button type="button" class="btn btn-success px-4 d-flex align-items-center" 
                                            data-method="getCroppedCanvas" data-bs-toggle="modal" data-bs-target="#getCroppedCanvasModal">
                                        <i class="bi bi-cloud-arrow-down-fill me-2"></i> Export
                                    </button>
                                </div>
                            </div>

                            <div class="col-lg-3 docs-toggles text-end mt-3 mt-lg-0">
                                <div class="dropdown">
                                    <button class="btn btn-dark w-100 dropdown-toggle rounded-3 py-2 px-4 shadow-sm" type="button" data-bs-toggle="dropdown">
                                        Aspect Ratio
                                    </button>
                                    <ul class="dropdown-menu dropdown-menu-end shadow-lg border-0 p-2">
                                        <li><a class="dropdown-item rounded-2" href="#" data-method="setAspectRatio" data-option="1.7777777777777777">16:9</a></li>
                                        <li><a class="dropdown-item rounded-2" href="#" data-method="setAspectRatio" data-option="1.3333333333333333">4:3</a></li>
                                        <li><a class="dropdown-item rounded-2" href="#" data-method="setAspectRatio" data-option="1">1:1</a></li>
                                        <li><hr class="dropdown-divider"></li>
                                        <li><a class="dropdown-item rounded-2" href="#" data-method="setAspectRatio" data-option="NaN">Free Mode</a></li>
                                    </ul>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- Right: Data Sidebar -->
                    <div class="col-xl-3 col-lg-4">
                        <div class="p-4 rounded-4 bg-light border h-100">
                            <label class="apple-label mb-4">Live Preview</label>
                            <div class="docs-preview d-flex flex-column gap-3 mb-5">
                                <div class="img-preview preview-lg rounded-4 border bg-white shadow-sm overflow-hidden" style="height: 180px;"></div>
                                <div class="img-preview preview-md rounded-3 border bg-white shadow-sm overflow-hidden d-none d-md-block" style="height: 100px;"></div>
                            </div>

                            <label class="apple-label mb-3">Spatial Data</label>
                            <div class="docs-data space-y-3">
                                <div class="input-group mb-2 shadow-sm rounded-3 overflow-hidden">
                                    <span class="input-group-text bg-white border-end-0 fw-bold px-3">X</span>
                                    <input type="text" class="form-control border-start-0 modern-input text-center" id="dataX" placeholder="0">
                                    <span class="input-group-text bg-white border-start-0 text-muted small">px</span>
                                </div>
                                <div class="input-group mb-2 shadow-sm rounded-3 overflow-hidden">
                                    <span class="input-group-text bg-white border-end-0 fw-bold px-3">Y</span>
                                    <input type="text" class="form-control border-start-0 modern-input text-center" id="dataY" placeholder="0">
                                    <span class="input-group-text bg-white border-start-0 text-muted small">px</span>
                                </div>
                                <div class="input-group mb-2 shadow-sm rounded-3 overflow-hidden">
                                    <span class="input-group-text bg-white border-end-0 fw-bold px-3">W</span>
                                    <input type="text" class="form-control border-start-0 modern-input text-center" id="dataWidth" placeholder="0">
                                    <span class="input-group-text bg-white border-start-0 text-muted small">px</span>
                                </div>
                                <div class="input-group mb-2 shadow-sm rounded-3 overflow-hidden">
                                    <span class="input-group-text bg-white border-end-0 fw-bold px-3">H</span>
                                    <input type="text" class="form-control border-start-0 modern-input text-center" id="dataHeight" placeholder="0">
                                    <span class="input-group-text bg-white border-start-0 text-muted small">px</span>
                                </div>
                            </div>
                            
                            <div class="mt-auto pt-4">
                                <button class="btn btn-light w-100 border rounded-3 py-2 fw-bold text-muted small shadow-sm" data-method="reset">
                                    <i class="bi bi-arrow-repeat me-2"></i> RESET CANVAS
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- Cropped Result Modal -->
<div class="modal fade" id="getCroppedCanvasModal" tabindex="-1">
    <div class="modal-dialog modal-lg modal-dialog-centered">
        <div class="modal-content rounded-4 border-0 shadow-lg overflow-hidden">
            <div class="modal-header border-0 bg-light p-4">
                <h5 class="modal-title fw-bold text-dark">
                    <i class="bi bi-scissors me-2 text-primary"></i> Cropped Export
                </h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body p-4 text-center bg-white" id="croppedResult">
                <!-- Result Canvas Injected Here -->
            </div>
            <div class="modal-footer border-0 bg-light p-4">
                <button type="button" class="btn btn-white border rounded-pill px-4" data-bs-dismiss="modal">Discard</button>
                <a class="btn btn-primary rounded-pill px-5 fw-bold" id="download" href="javascript:void(0);" download="xivig-cropped.jpg">
                    Download Asset
                </a>
            </div>
        </div>
    </div>
</div>

<script type="module">
    import { initImageCropper } from './src/scripts/FormPlugins.js';
    document.addEventListener('DOMContentLoaded', () => {
        initImageCropper();
    });
</script>

{{/admin-layout}}
